<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>功能列表</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0d1017;
    color:#e8eaee;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(184,148,95,.14), transparent 70%),
      radial-gradient(700px 500px at 85% 90%, rgba(90,120,200,.10), transparent 70%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:860px;
    margin:0 auto;
    padding:56px 24px 80px;
  }
  h1{
    margin:0 0 6px;
    font-size:24px;
    font-weight:700;
    letter-spacing:.06em;
    background:linear-gradient(90deg,#e9d3a4,#b8945f);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    margin:0 0 40px;
    font-size:13px;
    color:#7f8798;
    letter-spacing:.04em;
  }
  .cat{
    font-size:12px;
    letter-spacing:.12em;
    color:#9aa2b2;
    margin:32px 0 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .cat::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.08);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  a.card{
    display:block;
    padding:18px 20px;
    border-radius:14px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    text-decoration:none;
    color:inherit;
    transition:.2s ease;
  }
  a.card:hover{
    border-color:var(--gold,#b8945f);
    background:rgba(184,148,95,.10);
    transform:translateY(-1px);
  }
  a.card .name{
    font-size:15px;
    font-weight:700;
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  a.card .desc{
    font-size:12px;
    line-height:1.6;
    color:#8e96a8;
  }
  a.card .tag{
    display:inline-block;
    margin-top:10px;
    font-size:10px;
    letter-spacing:.1em;
    padding:3px 8px;
    border-radius:99px;
    border:1px solid rgba(184,148,95,.4);
    color:#d9bd85;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>功能合集</h1>
  <p class="sub">站内小工具与玩法</p>

  <div class="cat">评测与测试 <span style="color:#e0554f;font-size:11px;letter-spacing:.05em;">含恐怖内容警告</span></div>
  <div class="grid">
    <a class="card" href="test.html">
      <div class="name">人格解析</div>
      <div class="desc">多维度人格测试，交互式答题流程。</div>
      <span class="tag">评测</span>
    </a>
    <a class="card" href="psych.html">
      <div class="name">心理健康自评</div>
      <div class="desc">心理健康状态自评量表。</div>
      <span class="tag">评测</span>
    </a>
  </div>

  <div class="cat">实用工具</div>
  <div class="grid">
    <a class="card" href="cert.html">
      <div class="name">毕业证书制作</div>
      <div class="desc">在线填写信息，生成证书并导出 PDF。</div>
      <span class="tag">工具</span>
    </a>
    <a class="card" href="project.html">
      <div class="name">英语学习助手</div>
      <div class="desc">多词库背单词、听力练习、题库刷题与 AI 辅助。</div>
      <span class="tag">工具</span>
    </a>
  </div>
</div>

</body>
</html>
