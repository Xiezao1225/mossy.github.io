<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>人格解析 v2.1-debug</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: #f4f1ed;
    color: #2a2520;
    padding: 20px;
    transition: background 3s ease, color 3s ease;
}

/* 眼睛容器 */
#eye-wrap {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; justify-content: center; align-items: center;
    z-index: 0; opacity: 0; transition: opacity 4s ease;
}
#eye-wrap img {
    width: 180px; height: 180px;
    object-fit: contain;
    filter: brightness(0.85) contrast(1.1);
    transition: width 6s ease, height 6s ease, filter 4s ease;
}
#eye-wrap.late img {
    width: 280px; height: 280px;
}
#eye-wrap.later img {
    width: 420px; height: 420px;
}
#eye-wrap.phase-dark img {
    filter: brightness(0.4) contrast(1.4) saturate(0.8);
}

/* 自我指涉底栏 */
#meta {
    position: fixed; bottom: 8px; right: 12px;
    font-size: 8px; color: transparent;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px; pointer-events: none; z-index: 50;
    transition: color 4s; user-select: none;
}
#meta.on { color: #b0a898; }

/* 主容器 */
#app {
    max-width: 560px; width: 100%;
    padding: 48px 56px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.07);
    position: relative; z-index: 10;
    background: transparent;
    transition: border-color 3s;
}


/* 深色阶段：app容器保持文字可见 */
#app.phase-dark {
    background: rgba(0,0,0,0.18);
    border-color: rgba(255,255,255,0.06);
}

#app.phase-dark .opt-btn {
    border-color: rgba(255,255,255,0.1);
    color: #d0c0a8;
    opacity: 0.65;
}

#app.phase-dark .opt-btn:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.22);
    opacity: 0.8;
}

#app.phase-dark .q-text {
    color: #d0c0a8;
}

#app.phase-dark .q-num {
    color: #a08060;
}

#app.phase-dark .hdr {
    border-bottom-color: rgba(255,255,255,0.07);
}

#app.phase-dark .prog-wrap {
    background: rgba(255,255,255,0.04);
}

#app.phase-dark .prog-bar {
    background: rgba(255,255,255,0.18);
}

#app.phase-dark .brand,
#app.phase-dark .prog-t {
    color: #a08060;
    opacity: 0.7;
}

/* 特殊题文字 */
#app.phase-dark .sp-q {
    color: #d0c0a8;
}

/* 暗示文字 */
#app.phase-dark .hint {
    color: #b09070;
}

/* 结果页 */
#app.phase-dark .r-type,
#app.phase-dark .r-sub,
#app.phase-dark .r-desc,
#app.phase-dark .r-detail {
    color: #d0c0a8;
}

/* 头部 */
.hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.05); }
.brand { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.22; font-weight: 300; }
.prog-t { font-size: 9px; opacity: 0.22; letter-spacing: 1px; }
.prog-t em { font-style: normal; opacity: 1; }
.prog-wrap { height: 1px; background: rgba(0,0,0,0.04); border-radius: 1px; margin-bottom: 32px; overflow: hidden; }
.prog-bar { height: 100%; width: 0; background: rgba(0,0,0,0.1); border-radius: 1px; transition: width 0.6s ease, background 1s; }

/* 边缘阴影闪烁 */
#vignette {
  position: fixed; inset: 0; pointer-events: none;
  z-index: 9999; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.18) 100%);
  transition: opacity 0.15s ease;
}
#vignette.on { opacity: 1; }

/* 标题侵蚀 */
#welcome h1 {
  transition: letter-spacing 0.8s ease, color 0.8s ease, opacity 0.8s ease;
}
#welcome h1.corrupted {
  color: #c08070 !important;
  opacity: 0.75 !important;
}

/* 选项慢半拍 */
.opt-btn { transition: opacity 0.25s ease, transform 0.25s ease; }
.opt-btn.lagging { opacity: 0.4 !important; }

/* 犹豫提示 */
#hesit-line {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  font-family: system-ui, sans-serif; font-size: 11px;
  color: #6a5a50; letter-spacing: 2px; opacity: 0;
  transition: opacity 0.6s ease; pointer-events: none; z-index: 8000;
  white-space: nowrap;
}
#hesit-line.show { opacity: 1; }

/* 结果陷阱弹窗 */
#trap-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 9990; display: none;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
  font-family: system-ui, sans-serif;
}
#trap-overlay.show { display: flex; }
#trap-msg {
  font-size: 12px; color: #8a7a68; letter-spacing: 3px;
  text-transform: uppercase; text-align: center; line-height: 1.8;
}
#trap-input {
  background: none; border: none; border-bottom: 1px solid #4a4038;
  color: #c0a880; font-family: inherit; font-size: 14px;
  letter-spacing: 4px; text-align: center; padding: 6px 16px;
  outline: none; min-width: 200px;
}
#trap-input::placeholder { color: #3a3028; }
#trap-submit {
  font-family: inherit; font-size: 11px; letter-spacing: 4px;
  color: #5a5048; background: none; border: 1px solid #3a3530;
  padding: 8px 24px; cursor: pointer; text-transform: uppercase;
  transition: color 0.3s, border-color 0.3s;
}
#trap-submit:hover { color: #c0a880; border-color: #6a5a50; }

/* 设备信息 */
#device-line {
  font-size: 10px; color: #4a4038; letter-spacing: 1px;
  text-align: center; margin-top: 8px; opacity: 0;
  transition: opacity 1.5s ease; font-family: monospace;
}
#device-line.show { opacity: 1; }

/* 内容 */
.content { min-height: 240px; display: flex; flex-direction: column; justify-content: center; }

/* 欢迎 */
#welcome { text-align: center; }
#welcome h1 { font-size: 20px; font-weight: 200; letter-spacing: 8px; margin-bottom: 12px; opacity: 0.6; }
#welcome p { font-size: 11px; opacity: 0.38; line-height: 2.4; margin-bottom: 12px; }
#welcome .sub { font-size: 9px; opacity: 0.2; letter-spacing: 3px; margin-bottom: 28px; }
#start {
    background: transparent; border: 1px solid rgba(0,0,0,0.1); color: inherit;
    font-size: 10px; letter-spacing: 4px; padding: 11px 36px; cursor: pointer;
    font-family: inherit; text-transform: uppercase; font-weight: 300;
    opacity: 0.4; transition: opacity 0.3s;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    pointer-events: auto !important;
    position: relative; z-index: 100;
}
#start:hover, #start:active { opacity: 0.85; }

/* 题目 */
#q-area { display: none; }
#q-area.on { display: block; animation: in 0.5s ease; }
@keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes cdPulse { from{opacity:0.7;transform:translateX(-50%) scale(1)} to{opacity:1;transform:translateX(-50%) scale(1.05)} }
@keyframes cdNumPulse { from{opacity:0.85;transform:scale(1)} to{opacity:1;transform:scale(1.08)} }
.q-num { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.18; margin-bottom: 8px; }
.q-text { font-size: 15px; font-weight: 300; line-height: 2.1; margin-bottom: 24px; min-height: 44px; letter-spacing: 0.3px; transition: filter 0.5s, opacity 0.5s; }
.q-opts { display: flex; flex-direction: column; gap: 5px; }
.opt-btn {
    background: transparent; border: 1px solid rgba(0,0,0,0.05); border-radius: 1px;
    padding: 12px 14px; font-size: 13px; color: inherit; cursor: pointer;
    font-family: inherit; text-align: left; transition: all 0.18s;
    display: flex; align-items: center; gap: 10px;
    font-weight: 300; letter-spacing: 0.2px; opacity: 0.55;
}
.opt-btn:hover { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.12); transform: translateX(2px); opacity: 0.75; }
.opt-btn .l { width: 15px; height: 15px; border: 1px solid rgba(0,0,0,0.07); border-radius: 50%; font-size: 7.5px; display: flex; align-items: center; justify-content: center; opacity: 0.28; flex-shrink: 0; }

/* 特殊题 */
#sp-area { display: none; text-align: center; margin-top: 8px; }
#sp-area.on { display: block; }
.sp-q { font-size: 14px; font-weight: 300; color: #2a2520; line-height: 2.5; margin-bottom: 22px; letter-spacing: 0.4px; }
.sp-btn { display: none; }

/* 暗示文字 */
#hint-area { min-height: 16px; margin-top: 14px; }
.hint { font-size: 10px; color: #8a7060; opacity: 0; letter-spacing: 0.3px; font-weight: 300; font-style: italic; transition: opacity 1.2s; line-height: 1.8; }

/* 结果 */
#r-area { display: none; }
#r-area.on { display: block; animation: in 0.6s ease; }
.r-type { font-size: 9px; color: inherit; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.45; }
.r-sub { font-size: 17px; font-weight: 200; color: inherit; margin-bottom: 10px; letter-spacing: 3px; }
.r-desc { font-size: 11px; opacity: 0.3; line-height: 2; margin-bottom: 10px; }
.r-detail { border-top: 1px solid rgba(0,0,0,0.04); padding-top: 12px; font-size: 11px; opacity: 0.22; line-height: 2; }

/* 响应式 */
@media (max-width: 600px) {
    #app { padding: 32px 22px; }
    #welcome h1 { font-size: 16px; }
    .q-text { font-size: 13px; }
    .opt-btn { font-size: 12px; }
    #eye-wrap img { width: 120px !important; height: 120px !important; }
}
</style>
</head>
<body>

<div id="vignette"></div>
<div id="eye-wrap">
    <img src="resource/eye.webp" alt="" id="eye-img">
</div>
<div id="meta"></div>
<div id="hesit-line"></div>

<div id="app">
    <div class="hdr">
        <div class="brand">MindType</div>
        <div class="prog-t">第 <em id="q-n">0</em> / <span id="q-t">40</span> 题</div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>
    <div class="content">

        <div id="welcome">
            <h1>人格解析</h1>
            <p>通过 40 道题目，揭示你的认知密码。<br>请根据直觉作答，不必思考太久。</p>

            <div class="r-detail" id="r-detail"></div>

    </div>
</div>

<audio id="bgm" src="resource/began.mp3" preload="auto" loop></audio>

<!-- 结果陷阱弹窗 -->
<div id="trap-overlay">
    <div id="trap-msg"></div>
    <input id="trap-input" type="text" placeholder="输入后回车" autocomplete="off" spellcheck="false">
    <button id="trap-submit">确认</button>
</div>
<div id="device-line"></div>

<script>
// ================================================================
// 数据
// ================================================================
const QS = [
    {t:'在周末，你更愿意参加热闹的聚会还是安静地待在家里？',a:'热闹的聚会',b:'安静地居家',d:'EI',va:'E',vb:'I'},
    {t:'在团队讨论中，你倾向于主动表达观点还是先倾听他人？',a:'主动表达',b:'先倾听他人',d:'EI',va:'E',vb:'I'},
    {t:'与人相处时，你更喜欢成为焦点还是保持低调？',a:'成为焦点',b:'保持低调',d:'EI',va:'E',vb:'I'},
    {t:'你更享受与他人共事还是独自工作？',a:'与他人共事',b:'独自工作',d:'EI',va:'E',vb:'I'},
    {t:'当遇到困难时，你倾向于向朋友求助还是自己解决？',a:'向朋友求助',b:'自己解决',d:'EI',va:'E',vb:'I'},
    {t:'你更喜欢在社交活动中获得能量，还是在独处中恢复？',a:'社交活动',b:'独处恢复',d:'EI',va:'E',vb:'I'},
    {t:'你更愿意分享个人经历，还是保留私密？',a:'分享经历',b:'保留私密',d:'EI',va:'E',vb:'I'},
    {t:'你通常先行动再思考，还是先思考再行动？',a:'先行动',b:'先思考',d:'EI',va:'E',vb:'I'},
    {t:'你更关注眼前的细节，还是未来的各种可能性？',a:'眼前的细节',b:'未来的可能性',d:'SN',va:'S',vb:'N'},
    {t:'你更相信实际的经验积累，还是直觉的推测？',a:'实际经验',b:'直觉推测',d:'SN',va:'S',vb:'N'},
    {t:'当你学习新事物时，你更关注具体操作步骤还是整体概念？',a:'具体步骤',b:'整体概念',d:'SN',va:'S',vb:'N'},
    {t:'你更留意现实中的事实数据，还是隐藏的象征意义？',a:'事实数据',b:'象征意义',d:'SN',va:'S',vb:'N'},
    {t:'你更倾向于按已知方法做事，还是探索新的可能？',a:'按已知方法',b:'探索新可能',d:'SN',va:'S',vb:'N'},
    {t:'你更擅长记住细节，还是记住模式与联系？',a:'记住细节',b:'记住模式',d:'SN',va:'S',vb:'N'},
    {t:'你更喜欢阅读纪实作品还是科幻/想象文学？',a:'纪实作品',b:'科幻想象',d:'SN',va:'S',vb:'N'},
    {t:'你更关注此刻的体验，还是对未来的构想？',a:'此刻体验',b:'未来构想',d:'SN',va:'S',vb:'N'},
    {t:'This is where you are.',a:'Yes',b:'No',d:'SN',va:'S',vb:'N'},
    {t:'做重要决定时，你更依赖理性分析还是内心感受？',a:'理性分析',b:'内心感受',d:'TF',va:'T',vb:'F'},
    {t:'评价别人时，你更看重事实对错还是情感和谐？',a:'事实对错',b:'情感和谐',d:'TF',va:'T',vb:'F'},
    {t:'当冲突发生时，你更倾向于讲道理还是照顾情绪？',a:'讲道理',b:'照顾情绪',d:'TF',va:'T',vb:'F'},
    {t:'你更看重逻辑一致性还是人际关系的温暖？',a:'逻辑一致',b:'人际关系',d:'TF',va:'T',vb:'F'},
    {t:'你更擅长分析问题还是体察他人感受？',a:'分析问题',b:'体察感受',d:'TF',va:'T',vb:'F'},
    {t:'你通常以客观标准还是主观价值来评判事物？',a:'客观标准',b:'主观价值',d:'TF',va:'T',vb:'F'},
    {t:'你更相信科学证据还是个人直觉？',a:'科学证据',b:'个人直觉',d:'TF',va:'T',vb:'F'},
    {t:'你更喜欢生活有明确的计划，还是保持灵活与开放？',a:'明确计划',b:'灵活开放',d:'JP',va:'J',vb:'P'},
    {t:'你更习惯按部就班，还是随遇而安？',a:'按部就班',b:'随遇而安',d:'JP',va:'J',vb:'P'},
    {t:'当事情出现变化时，你更倾向立即调整计划还是先观察？',a:'立即调整',b:'先观察',d:'JP',va:'J',vb:'P'},
    {t:'你更喜欢日程排满还是留出自由时间？',a:'日程排满',b:'自由时间',d:'JP',va:'J',vb:'P'},
    {t:'你更享受完成既定任务还是随性探索？',a:'完成任务',b:'随性探索',d:'JP',va:'J',vb:'P'},
    {t:'你更倾向于作出决定并坚持，还是保持开放选项？',a:'作出决定',b:'保持开放',d:'JP',va:'J',vb:'P'},
    {t:'你更喜欢有序的环境还是自由的空间？',a:'有序环境',b:'自由空间',d:'JP',va:'J',vb:'P'}
];

// 诡异题（选任何选项都触发惩罚，制造压迫感）
// 对应 SEQ 位置：weirdIdx = weirdQ × 4 + 选中的普通题序号
const WEIRD_QS = new Set([6, 16, 20, 23, 27]); // QS 索引

// 特殊题：文字恐怖谷
// 手法：它知道/自我递归/第三人突现/几乎正确的错误/时间错位/反刍重复
const SPQS = [
    // Q10
    '发生了一些异常。正在恢复。',
    // Q20
    '发生了一些异常。正在恢复。',
    // Q30
    '发生了一些异常。正在恢复。',
    // Q40
    '发生了一些异常。正在恢复。',
    // Q50
    '发生了一些异常。正在恢复。',
    // Q60
    '发生了一些异常。正在恢复。',
    // Q70
    '发生了一些异常。正在恢复。',
    // Q80
    '发生了一些异常。正在恢复。',
    // Q90
    '发生了一些异常。正在恢复。',
    // Q100
    '发生了一些异常。正在恢复。'
];

// ================================================================
// "他来了"效果（四个变体：silent / announce / redText / camera）
// ================================================================
let itCameState = 'idle';
let itCameTimeout = null, itCameTimeout2 = null;
let itCameVariant = 'silent';

// 变体权重：60% 沉默伪装，13.3% 每个新变体
function pickItCameVariant() {
    const r = Math.random();
    if (r < 0.60) return 'silent';
    if (r < 0.7333) return 'announce';
    if (r < 0.8666) return 'redText';
    return 'camera';
}

// 通用清理
let itCameResolve = null; // 「它来了」结束后回调（特殊题等待下一题用）
function cleanupItCame() {
    if (itCameTimeout) { clearTimeout(itCameTimeout); itCameTimeout = null; }
    if (itCameTimeout2) { clearTimeout(itCameTimeout2); itCameTimeout2 = null; }
    itCameState = 'idle';
    if (itCameResolve) { const r = itCameResolve; itCameResolve = null; r(); }
}

// 入口：按变体分发
function triggerItCame(variant) {
    if (itCameState !== 'idle') return;
    variant = variant || pickItCameVariant();
    itCameVariant = variant;
    if (variant === 'announce') return triggerItCame_announce();
    if (variant === 'redText')  return triggerItCame_redText();
    if (variant === 'camera')   return triggerItCame_camera();
    return triggerItCame_silent();
}

// ------------------------------------------------------------
// 变体1：沉默伪装（原版完整流程，保留为默认）
// ------------------------------------------------------------
function triggerItCame_silent() {
    itCameState = 'asking';
    // 尺寸在 #eye-wrap img 上（容器是 flex 居中层，设置容器无效）；opacity 需保存原值恢复
    const comp = getComputedStyle(eyeImg);
    const origW = parseFloat(comp.width);
    const origH = parseFloat(comp.height);
    const origOpacity = eyeWrap.style.opacity;

    const overlay = document.createElement('div');
    overlay.id = 'cam-ask';
    overlay.style.cssText = `position:fixed;inset:0;background:#000;z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;opacity:0;transition:opacity 1.5s ease;`;

    const msg = document.createElement('div');
    msg.style.cssText = `font-family:system-ui,sans-serif;font-size:13px;color:#b0a090;letter-spacing:6px;text-transform:uppercase;text-align:center;`;
    msg.textContent = '检测到设备连接';

    const sub = document.createElement('div');
    sub.style.cssText = `font-family:system-ui,sans-serif;font-size:11px;color:#4a4038;letter-spacing:2px;text-align:center;`;
    sub.textContent = '[ USB 摄像头 ] 已连接 — 请求访问权限';

function triggerItCame_camera() {
    itCameState = 'asking';

    // 先在后台静默调 getUserMedia，让原生权限弹窗出现

                    restoreBgmAfterSpecial();
                }, 1500);
            }, 5000);
        })
        .catch(() => {
            // 拒绝或失败：温和收场，不强迫
            itCameState = 'watching';
            const overlay = document.createElement('div');
            overlay.style.cssText = `position:fixed;inset:0;background:#000;z-index:9000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s ease;`;

            requestAnimationFrame(() => { overlay.style.opacity = '1'; });
            itCameTimeout = setTimeout(() => {
                overlay.style.opacity = '0';
                itCameTimeout2 = setTimeout(() => { overlay.remove(); cleanupItCame(); restoreBgmAfterSpecial(); }, 1500);
            }, 3000);
        });
}

        osc.frequency.value = 40;

// ================================================================

function startEscapeCountdown(ov, origTxt) {
    // 移除原干扰文字
    if (origTxt && origTxt.parentNode) {
        origTxt.style.transition = 'opacity 0.5s';
        origTxt.style.opacity = '0';
        setTimeout(() => { if (origTxt.parentNode) origTxt.parentNode.removeChild(origTxt); }, 600);
    }

    // 倒计时容器
    const cd = document.createElement('div');
    cd.id = 'escape-countdown';
    cd.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:1;';
    document.body.appendChild(cd);
    // ov 进入半透，给倒计时让位
    if (ov) { ov.style.transition = 'opacity 1s'; ov.style.opacity = '0.3'; }

    // 顶部恐吓文字（跳动变红）
    const topLine = document.createElement('div');

    cd.appendChild(num);

    // 单位

    cd.appendChild(barBg);

    // 倒计时中随机跳出的恐怖文字
    const hauntingTexts = [
        '它在你身后', '别回头', '你听到声音了吗', '门后面有人',
        '镜子里在动', '它知道你的名字', '你跑不掉的', '不要看它',
        '一直在看', '它饿了', '你选错了', '回去选别的', '太迟了',
        '它在笑', '闭眼也没用', '你摆脱不了', '它就是你'
    ];

    // 进度字幕（提醒用户真相）

    tipLine.style.cssText = 'position:absolute;bottom:8%;left:50%;transform:translateX(-50%);color:#555;font-size:clamp(9px,1.3vw,12px);letter-spacing:3px;text-align:center;width:90%;font-family:Courier New,monospace;';
    tipLine.textContent = '没有人能完成测试';
    cd.appendChild(tipLine);

    // 倒计时逻辑
    let left = 60;
    const totalMs = 60000;
    const startT = Date.now();

    // 心跳背景音（持续 1 分钟）
    let hbInterval = null;
    try {
        hbInterval = setInterval(() => {
            if (left <= 0) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 50;
            g.gain.setValueAtTime(0, ctx.currentTime);
            g.gain.linearRampToValueAtTime(left < 20 ? 0.7 : 0.35, ctx.currentTime + 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.25);
            setTimeout(() => ctx.close(), 350);
        }, 1200 + Math.random() * 400);
    } catch(e) {}

    // 持续轻微震屏
    const shakeInt = setInterval(() => {
        if (left <= 0) return;
        const intensity = 1 + (60 - left) * 0.15; // 越到最后抖得越狠

        const y = (Math.random() - 0.5) * intensity;
        cd.style.transform = `translate(${x}px, ${y}px)`;
    }, 60);

    // 跳动吓人逻辑：随时间越来越频繁
    const scareInterval = setInterval(() => {
        if (left <= 0) return;
        // 30秒后跳动频率提高
        if (left < 30 && Math.random() < 0.5) {
            spawnQuickJumpscare(cd);
        } else if (Math.random() < 0.25) {
            spawnQuickJumpscare(cd);
        }
    }, 2000);

    // 随机飘字（持续 60 秒，不影响主数字）
    const floatTextInterval = setInterval(() => {
        if (left <= 0) return;
        const t = document.createElement('div');
        const txt = hauntingTexts[Math.floor(Math.random() * hauntingTexts.length)];
        t.textContent = txt;
        t.style.cssText = `position:absolute;left:${10 + Math.random() * 80}%;top:${10 + Math.random() * 70}%;color:#aa0000;font-size:${12 + Math.random() * 8}px;letter-spacing:2px;opacity:0;transition:opacity 0.3s;pointer-events:none;text-shadow:0 0 8px #550000;font-style:italic;transform:rotate(${(Math.random() - 0.5) * 20}deg);`;

            t.style.transition = 'opacity 0.8s';
            t.style.opacity = '0';
            setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 900);
        }, 1500 + Math.random() * 1000);
    }, 1800);

    // 主计时器
    const tick = setInterval(() => {
        left--;
        num.textContent = left < 10 ? '0' + left : String(left);
        // 数字越小越红
        if (left < 10) {
            num.style.color = '#ff2222';
            num.style.textShadow = '0 0 60px #ff0000, 0 0 120px #ff0000, 0 0 200px #880000';
            num.style.animation = 'cdPulse 0.4s ease-in-out infinite alternate';
        } else if (left < 20) {
            num.style.animation = 'cdPulse 0.5s ease-in-out infinite alternate';
        }
        // 进度条
        barFg.style.width = (left / 60 * 100) + '%';
        // 顶部文字变化
        if (left === 30) {
            topLine.textContent = '只剩 30 秒 · 它在微笑';
            tipLine.textContent = '现在跳出去 · 真的能跑掉吗';
        } else if (left === 10) {
            topLine.textContent = '来不及了';
            tipLine.textContent = '欢迎 · 下一个测试者';
        } else if (left === 5) {
            topLine.textContent = '你逃不掉的';
            tipLine.textContent = '它一直都在';
        }

        if (left <= 0) {
            clearInterval(tick);
            clearInterval(shakeInt);
            clearInterval(scareInterval);
            clearInterval(floatTextInterval);
            if (hbInterval) clearInterval(hbInterval);
            // 最后一次全屏跳脸
            spawnQuickJumpscare(cd, true);
            // 跳转
            setTimeout(() => {
                window.location.href = 'https://www.bilibili.com/video/BV1H5uj6gEUF';
            }, 1500);
        }
    }, 1000);
}

        },

        },
        () => {
            // level3: 文字开始变形+闪烁
            el.innerHTML = '发生了一些异常。正在恢复。';
            let ticks = 0;
            const iv = setInterval(() => {

                const maps = [
                    {'发':'髪','生':'笙','了':'了','一':'亊','些':'眂','异':'罙','常':'瑺',
                     '正':'佱','在':'両','恢':'诙','复':'馥'},

                     '正':'凒','在':'両','恢':'灰','复':'複'},
                ];
                const map = maps[ticks % 2];
                let t = '发生了一些异常。正在恢复。';
                for (const [k, v] of Object.entries(map)) {
                    if (Math.random() < 0.5) t = t.replace(k, v);
                }
                el.innerHTML = t;
                el.style.opacity = ticks % 2 === 0 ? '0.85' : '1';
                if (ticks > 6) { clearInterval(iv); el.style.opacity = '1'; }
            }, 350);
        },
        () => {
            // level4: 完全不可读+抖动
            el.innerHTML = '发生了一些异常。正在恢复。';
            let ticks = 0;
            const iv = setInterval(() => {
                ticks++;

let ambientCtx = null, ambientOsc = null, ambientGain = null;
let heartbeatTimeout = null;
let ambientStarted = false;

function startAmbient() {
    if (ambientStarted) return;
    ambientStarted = true;
    try {
        ambientCtx = new (window.AudioContext || window.webkitAudioContext)();
        ambientOsc = ambientCtx.createOscillator();
        ambientGain = ambientCtx.createGain();
        ambientOsc.type = 'sawtooth';
        ambientOsc.frequency.value = 30;
        ambientGain.gain.setValueAtTime(0, ambientCtx.currentTime);
        ambientGain.gain.linearRampToValueAtTime(0.04, ambientCtx.currentTime + 3);
        ambientOsc.connect(ambientGain);
        ambientGain.connect(ambientCtx.destination);
        ambientOsc.start();
    } catch(e) {}
    scheduleHeartbeat();
}

function stopAmbient() {
    if (heartbeatTimeout) { clearTimeout(heartbeatTimeout); heartbeatTimeout = null; }
    if (ambientOsc) { try { ambientOsc.stop(); } catch(e){} ambientOsc = null; }
    if (ambientCtx) { try { ambientCtx.close(); } catch(e){} ambientCtx = null; }
    ambientStarted = false;
}

function scheduleHeartbeat() {
    if (!ambientStarted) return;
    const delay = 5000 + Math.random() * 7000;
    heartbeatTimeout = setTimeout(() => {
        if (!ambientGain || !ambientCtx) return;
        try {
            const hbGain = ambientCtx.createGain();
            hbGain.gain.setValueAtTime(0.25, ambientCtx.currentTime);
            hbGain.gain.exponentialRampToValueAtTime(0.001, ambientCtx.currentTime + 0.35);
            const hbOsc = ambientCtx.createOscillator();
            hbOsc.type = 'sawtooth';
            hbOsc.frequency.value = 50;
            hbOsc.connect(hbGain);
            hbGain.connect(ambientCtx.destination);
            hbOsc.start();
            hbOsc.stop(ambientCtx.currentTime + 0.35);
        } catch(e) {}
        scheduleHeartbeat();
    }, delay);
}

function muteBgmForSpecial() {
    if (!bgm) return;
    const step = bgm.volume / 20;
    const fade = setInterval(() => {
        if (!bgm) { clearInterval(fade); return; }
        bgm.volume = Math.max(0, bgm.volume - step);
        if (bgm.volume <= 0) { bgm.volume = 0; clearInterval(fade); }
    }, 50);
}

function restoreBgmAfterSpecial() {
    if (!bgm) return;
    const targetVol = 0.45;
    const step = targetVol / 20;
    const fade = setInterval(() => {
        if (!bgm) { clearInterval(fade); return; }
        bgm.volume = Math.min(targetVol, bgm.volume + step);
        if (bgm.volume >= targetVol) { bgm.volume = targetVol; clearInterval(fade); }
    }, 50);
}

function corruptText_fast(s) {

    const near = {
        '人':['入','八'],'的':['他','地'],'在':['有','存'],'是':['足','是'],'不':['不','木'],
        '我':['找','成'],'有':['在','友'],'你':['你','称'],'他':['人','它'],'这':['这','这'],
        '的':['他','地'],'为':['办','位'],'个':['中','人'],'和':['利','知'],'来':['米','未'],
    };
    return s.split('').map(c => {
        if (near[c] && Math.random() < 0.4) return near[c][Math.floor(Math.random() * near[c].length)];
        if (/[a-zA-Z]/.test(c) && Math.random() < 0.3) return Math.random() < 0.5 ? c.toUpperCase() : c;

    }).join('');

// 合成 BGM 降级：began.mp3 缺失/加载失败时，用 Web Audio 生成持续恐怖氛围音
let synthBgm = null; // { ctx, gain }

function startSynthBGM() {
    if (synthBgm) return;
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const master = ctx.createGain();
        master.gain.value = 0; // 由 startBGM 渐入驱动
        master.connect(ctx.destination);
        // 双失谐低频 drone（54Hz / 55.5Hz 拍频）
        const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 54;
        const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.5;
        const g1 = ctx.createGain(); g1.gain.value = 0.5;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
        o1.connect(g1); o2.connect(g1); g1.connect(lp); lp.connect(master);
        o1.start(); o2.start();
        // 慢速呼吸起伏
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
        const lfoG = ctx.createGain(); lfoG.gain.value = 0.18;
        lfo.connect(lfoG); lfoG.connect(master.gain);
        lfo.start();
        // 随机心跳（3-7 秒一次）
        const beat = () => {
            if (!synthBgm || !synthBgm.ctx) return;
            try {
                const bCtx = synthBgm.ctx;
                const bg = bCtx.createGain();
                bg.gain.setValueAtTime(0.0, bCtx.currentTime);
                bg.gain.linearRampToValueAtTime(0.45, bCtx.currentTime + 0.02);
                bg.gain.exponentialRampToValueAtTime(0.001, bCtx.currentTime + 0.22);
                const bo = bCtx.createOscillator(); bo.type = 'sine'; bo.frequency.value = 48;
                bo.connect(bg); bg.connect(master);
                bo.start(); bo.stop(bCtx.currentTime + 0.25);
            } catch(e) {}
            setTimeout(beat, 3000 + Math.random() * 4000);
        };
        beat();
        synthBgm = { ctx, gain: master };
    } catch(e) {}
}

// began.mp3 缺失或加载失败时，降级为合成 BGM
bgm.addEventListener('error', () => startSynthBGM());

function startBGM() {
    bgm.volume = 0;
    if (synthBgm && synthBgm.gain) synthBgm.gain.gain.value = 0;
    const p = bgm.play();
    if (p && p.catch) p.catch(() => {});
    // 渐入
    let vol = 0;
    const fadeIn = setInterval(() => {
        vol = Math.min(0.45, vol + 0.015);
        bgm.volume = vol;
        if (synthBgm && synthBgm.gain) synthBgm.gain.gain.value = vol * 0.25;
        if (vol >= 0.45) clearInterval(fadeIn);
    }, 200);
}

function setBGMVolume(v, dur = 2000) {
    const now = bgm.volume;
    const step = (v - now) / (dur / 50);
    const fade = setInterval(() => {
        bgm.volume = Math.max(0, Math.min(1, bgm.volume + step));
        if (synthBgm && synthBgm.gain) synthBgm.gain.gain.value = bgm.volume * 0.25;
        if ((step > 0 && bgm.volume >= v) || (step < 0 && bgm.volume <= v)) {
            bgm.volume = v;
            if (synthBgm && synthBgm.gain) synthBgm.gain.gain.value = v * 0.25;
            clearInterval(fade);
        }
    }, 50);
}

// 低频噪音（保留为一种效果）
function playNoise() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufSize = ctx.sampleRate * 3;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 600;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.8);
        g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 2.2);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.5);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 3.5);
        setTimeout(() => ctx.close(), 4000);
    } catch(e) {}
}

    const bgs = ['#f4f1ed','#e8e3dc','#ddd6ca','#c8bfb2','#a89888','#6a5a50','#2e2420','#100c0a','#050302','#000'];

    document.body.style.color = fgs[p] || fgs[0];

function renderQ(idx) {

    const oldIp = document.getElementById('ip-reveal');

    qN.textContent = idx + 1;
    qTEl.textContent = TOTAL;
    prog.style.width = `${(idx / TOTAL) * 100}%`;
    qLbl.textContent = `问题 ${idx + 1}`;
    qTxt.style.filter = '';

    if (q.sp) {
        qOpts.style.display = 'none';
        spArea.classList.add('on');

        qArea.classList.add('on');
        welcome.style.display = 'none';
        rArea.classList.remove('on');
        // 特殊题：随机触发一种效果
        triggerSpecialEffect();

        const advance = () => {
            if (advanced) return;
            advanced = true;
            cur++;
            if (cur < TOTAL) renderQ(cur);
            else showResult();
        };
        if (itCameState !== 'idle') {
            // 「它来了」黑屏期间暂停跳题，等效果结束再进入下一题
            // （25 秒安全兑底：防止摄像头权限弹窗一直挂着导致卡死）
            itCameResolve = advance;
            setTimeout(() => {
                if (itCameState !== 'idle') { cleanupItCame(); advance(); }
            }, 25000);
        } else {
            setTimeout(advance, 4000);
        }
        return;
    }

    qOpts.style.display = 'flex';
    spArea.classList.remove('on');
    qTxt.textContent = q.t;
    // 5题后开始文字恐怖谷
    if (idx >= 5) startQuestionCorruption(qTxt, idx);

let choiceOverlay = null;
let choiceStayBtn = null;
let choiceLeaveBtn = null;
let choiceAttempts = 0;
let choiceResolved = false;
let choiceMouseHandler = null;
let choiceTimer = null;

function showChoice() {

    choiceOverlay = document.createElement('div');

    document.body.appendChild(choiceOverlay);

    // 文字（心理压迫）
    const txt = document.createElement('div');
    txt.id = 'choice-text';
    txt.style.cssText = 'color:#ddd;font-size:clamp(15px,2.2vw,20px);line-height:2;text-align:center;max-width:600px;letter-spacing:2px;font-family:Courier New,monospace;';

    choiceOverlay.appendChild(txt);

    // 描述小字
    const sub = document.createElement('div');
    sub.style.cssText = 'color:#666;font-size:clamp(11px,1.5vw,13px);margin-top:30px;letter-spacing:3px;text-align:center;';
    sub.textContent = '你可以随时选择离开。';
    choiceOverlay.appendChild(sub);

    // 按钮容器
    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-top:50px;position:relative;width:340px;height:160px;';
    choiceOverlay.appendChild(wrap);

    // 留下按钮（固定左边）
    choiceStayBtn = document.createElement('button');
    choiceStayBtn.id = 'choice-stay';
    choiceStayBtn.textContent = '留下';
    choiceStayBtn.style.cssText = 'position:absolute;left:0;top:50%;transform:translateY(-50%);width:130px;height:60px;background:#222;color:#eee;border:1px solid #555;font-size:18px;letter-spacing:8px;cursor:pointer;font-family:inherit;transition:all 0.2s;';
    choiceStayBtn.addEventListener('mouseenter', () => {
        choiceStayBtn.style.background = '#3a3a3a';
        choiceStayBtn.style.borderColor = '#888';
    });
    choiceStayBtn.addEventListener('mouseleave', () => {
        choiceStayBtn.style.background = '#222';
        choiceStayBtn.style.borderColor = '#555';
    });
    choiceStayBtn.addEventListener('click', () => {
        if (choiceResolved) return;
        choiceResolved = true;
        resolveChoice('stay');
    });
    wrap.appendChild(choiceStayBtn);

    // 离开按钮（初始位置在右边，会跳走）
    choiceLeaveBtn = document.createElement('button');
    choiceLeaveBtn.id = 'choice-leave';
    choiceLeaveBtn.textContent = '离开';
    choiceLeaveBtn.style.cssText = 'position:absolute;left:200px;top:50%;transform:translateY(-50%);width:130px;height:60px;background:#2a0000;color:#ff8888;border:1px solid #660000;font-size:18px;letter-spacing:8px;cursor:pointer;font-family:inherit;transition:left 0.25s cubic-bezier(0.2,0.9,0.3,1), top 0.25s cubic-bezier(0.2,0.9,0.3,1);';
    choiceLeaveBtn.addEventListener('click', (e) => {
        // 理论上跳得很厉几乎点不到，但如果点到了...
        e.preventDefault();
        if (choiceResolved) return;
        if (choiceAttempts < 3) {
            // 第一次、第二次点中也跳走
            choiceAttempts++;
            jumpLeaveBtn();
            showHint('你点了离开。但离开没有那么容易。', 3000);
            try { playLowTone(); } catch(e) {}
        } else {
            // 第三次点中：放过
            choiceResolved = true;
            resolveChoice('leave');
        }
    });
    wrap.appendChild(choiceLeaveBtn);

    // 全局 mousemove 监听：如果鼠标接近离开按钮，跳走
    choiceMouseHandler = (e) => {
        if (!choiceLeaveBtn || choiceResolved) return;
        const rect = choiceLeaveBtn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        // 100px 范围内触发跳走
        if (dist < 100) {
            choiceAttempts++;
            jumpLeaveBtn();
            // 跳多了文字会变
            updateChoiceText();
        }
    };
    document.addEventListener('mousemove', choiceMouseHandler);

    // 15 秒倒计时：到时间自动选"留下"
    let sec = 15;
    const tick = setInterval(() => {
        if (choiceResolved) { clearInterval(tick); return; }
        sec--;
        sub.textContent = '你可以随时选择离开。 (' + sec + ' 秒后默认留下)';
        if (sec <= 0) {
            clearInterval(tick);
            if (!choiceResolved) {
                choiceResolved = true;
                resolveChoice('stay');
            }
        }
    }, 1000);
    choiceTimer = tick;
}

function jumpLeaveBtn() {
    if (!choiceLeaveBtn) return;
    // 在 wrap 容器范围内随机跳
    const wrap = choiceLeaveBtn.parentElement;
    const wrapRect = wrap.getBoundingClientRect();
    const btnW = 130, btnH = 60;
    // 留 10px 边距
    const maxX = Math.max(0, wrapRect.width - btnW - 10);
    const maxY = Math.max(0, wrapRect.height - btnH - 10);
    const newX = 10 + Math.random() * maxX;
    const newY = 10 + Math.random() * maxY;
    choiceLeaveBtn.style.left = newX + 'px';
    choiceLeaveBtn.style.top = newY + 'px';
    choiceLeaveBtn.style.transform = 'none';
    // 跳的时候闪一下
    choiceLeaveBtn.style.background = '#5a0000';
    setTimeout(() => { if (choiceLeaveBtn) choiceLeaveBtn.style.background = '#2a0000'; }, 150);
    // 微微"受惊"音效
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 800;
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
        setTimeout(() => ctx.close(), 150);
    } catch(e) {}
}

function updateChoiceText() {
    const txt = document.getElementById('choice-text');
    if (!txt) return;
    if (choiceAttempts >= 15) {
        txt.innerHTML = '离开按钮已经在请求原谅。<br><br><span style="color:#888;font-size:14px;">（它已经累了。）</span>';
        if (choiceLeaveBtn) choiceLeaveBtn.style.opacity = '0.3';
    } else if (choiceAttempts >= 10) {
        txt.innerHTML = '你试了 ' + choiceAttempts + ' 次了。<br><br><span style="color:#888;font-size:14px;">真的还想走吗？</span>';
    } else if (choiceAttempts >= 5) {
        txt.innerHTML = '它不会让你离开的。<br><br><span style="color:#888;font-size:14px;">这才是它想要你选的。</span>';
    } else if (choiceAttempts >= 2) {
        txt.innerHTML = '你确定要点“离开”吗？<br><br><span style="color:#888;font-size:14px;">它不想你走。</span>';
    }
}

function resolveChoice(action) {
    if (choiceMouseHandler) {
        document.removeEventListener('mousemove', choiceMouseHandler);
        choiceMouseHandler = null;
    }
    if (choiceTimer) { clearInterval(choiceTimer); choiceTimer = null; }

    if (action === 'stay') {
        // 留下：先移除选择层，再触发跳脸（否则跳脸会被遮罩盖住看不见）
        hideChoice();
        showHint('你选了留下。', 2000);
        // 先执行 jumpscare，然后继续下一题
        showStayJumpscare();
        return; // 等待 jumpscare 结束后再继续
    } else {
        // 离开：黑屏+一声闷响+直接跳到结果页（跳过剩下题目）
        showHint('你点了离开。', 2500);
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 40;
            g.gain.setValueAtTime(0.5, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 1.5);
            setTimeout(() => ctx.close(), 1600);
        } catch(e) {}
    }

    // 淡出 overlay（仅处理离开分支，stay 已在上面 return）
    if (choiceOverlay) {
        choiceOverlay.style.transition = 'opacity 0.8s ease';
        choiceOverlay.style.opacity = '0';
        setTimeout(() => {
            if (choiceOverlay && choiceOverlay.parentNode) {
                choiceOverlay.parentNode.removeChild(choiceOverlay);
            }
            choiceOverlay = null;
            choiceStayBtn = null;
            choiceLeaveBtn = null;
            // 离开：跳到结果页（剩余题目空答案）
            while (cur < TOTAL - 1) {
                ans[cur] = { v: 0, label: '(离开)', ltr: '?', delay: 0 };
                cur++;
            }
            showResult();
        }, 900);
    } else {
        showResult();
    }
}

// ================================================================
// 跳脸：点击"留下"或倒计时结束自动留下时触发
// 眼睛瞬间放大 + 红闪 + 低频冲击；500ms 后恢复，然后继续下一题
// ================================================================
function showStayJumpscare() {
    const el = eyeImg;
    const wrap = eyeWrap;
    const computed = getComputedStyle(el);
    const origW = computed.width;
    const origH = computed.height;
    const origOpacity = computed.opacity;
    const origZ = wrap.style.zIndex;

    // 闪红闪白
    flash('#7a0000', 40);
    setTimeout(() => flash('#fff', 60), 45);

    // 眼睛移到正中，瞬间放大（抬到遮罩之上，确保可见）
    wrap.style.transition = 'none';
    wrap.style.zIndex = '100000';
    wrap.style.top = '50%';
    wrap.style.left = '50%';
    wrap.style.transform = 'translate(-50%,-50%)';
    el.style.transition = 'width 0.06s, height 0.06s';
    el.style.width = '98vw';
    el.style.height = '98vh';
    el.style.objectFit = 'cover';
    wrap.style.opacity = '1';

    // 200% 音量（BGM + 低频冲击）
    const prevVol = bgm ? bgm.volume : 0.5;
    if (bgm) bgm.volume = Math.min(1.0, prevVol * 2);
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.frequency.value = 40;
        osc.type = 'sawtooth';
        g.gain.setValueAtTime(1.8, ctx.currentTime); // 200% 音量
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
        setTimeout(() => ctx.close(), 600);
    } catch(e) {}

    // 500ms 后恢复原状，然后继续下一题
    setTimeout(() => {
        wrap.style.transition = 'all 0.7s ease';
        wrap.style.top = '';
        wrap.style.left = '';
        wrap.style.transform = '';
        el.style.transition = 'width 0.6s ease, height 0.6s ease';
        el.style.width = origW;
        el.style.height = origH;
        el.style.objectFit = 'contain';
        wrap.style.opacity = origOpacity;
        setTimeout(() => {
            wrap.style.transition = '';
            wrap.style.zIndex = origZ;
            el.style.transition = '';
            if (bgm) setBGMVolume(prevVol, 2500);
            // jumpscare 结束，继续下一题
            cur++;
            if (cur < TOTAL) renderQ(cur);
            else showResult();
        }, 800);
    }, 500);
}

function hideChoice() {
    if (choiceMouseHandler) {
        document.removeEventListener('mousemove', choiceMouseHandler);
        choiceMouseHandler = null;
    }
    if (choiceTimer) { clearInterval(choiceTimer); choiceTimer = null; }
    if (choiceOverlay && choiceOverlay.parentNode) {
        choiceOverlay.parentNode.removeChild(choiceOverlay);
    }
    choiceOverlay = null;
    choiceStayBtn = null;
    choiceLeaveBtn = null;
}

// ================================================================
// 答案处理
// ================================================================
function handleAns(v, label, ltr) {
    const delay = Date.now() - lastClick;
    lastClick = Date.now();
    ans[cur] = { v, label, ltr, delay };
    cur++; // ← 必须在 weird/第8题判断之前，否则 cur 卡住不动
    try { console.log('[handleAns] cur=' + cur + ' label=' + label + ' weird=' + !!(SEQ[cur] && SEQ[cur].weird)); } catch(e) {}

    // 悬停暗示：你本来想选另一个
    const h = hoverCount[cur];
    if (h && ph >= 5 && !wrongChoiceShown) {
        const first = h.a >= h.b ? 'A' : 'B';
        const chosen = ltr;
        if (first !== chosen && Math.random() < 0.4) {
            const wrongLabel = first === 'A' ? SEQ[cur].a : SEQ[cur].b;
            showHint('你本来想选 "' + wrongLabel + '"。', 5000);
            wrongChoiceShown = true;
        }
    }

    // 犹豫暗示
    if (delay > 4000 && ph >= 3) {
        showHint('你在这里停了很久。', 4000);
    }

    // 快速点击：恐怖质问 + 红闪
    if (delay < 500 && ph >= 4) {
        const q = [
            '真的想了吗？',
            '真的想了吗？？',
            '真的想了吗？？？',
            '你真的在想吗？',
            '还是只是在点？',
            '这三个字，你真的读了吗？',
            '想了。再想一遍。',
            '你选的。不是系统选的。',
        ];
        flash('#6a0000', 120);
        showHint(q[Math.floor(Math.random() * q.length)], 2800);
        wrongChoiceShown = false; // 重置，允许再次触发
    }

    // 诡异题惩罚：逐次升级（卡住不前进），5次后放过
    const q = SEQ[cur];
    if (q && q.weird) {
        if (!weirdCountMap) weirdCountMap = new Map();
        const c = (weirdCountMap.get(cur) || 0) + 1;
        weirdCountMap.set(cur, c);
        if (c > 5) {
            // 放过：重置计数，正常前进
            weirdCountMap.delete(cur);
            try { console.log('[weird] 放过 cur=' + cur + ' c=' + c); } catch(e) {}
        } else {
            try { console.log('[weird] 卡住 cur=' + cur + ' c=' + c); } catch(e) {}
            weirdAns(c);
            return;
        }
    }

    try { console.log('[handleAns] ans done, cur++ => ' + cur); } catch(e) {}
    // 答完第 15 题后跳出选择：留下 / 离开（离开按钮会跳走）
    if (cur === 15) {
        try { console.log('[trigger] showChoice cur=' + cur); } catch(e) {}
        showChoice();
        return;
    }
    if (cur < TOTAL) renderQ(cur);
    else showResult();
}

function showResult() {
    stopScareCycle();
    stopAmbient();
    applyPhase(9);
    clearHint();

    welcome.style.display = 'none';
    rArea.classList.add('on');
    prog.style.width = '100%';
    eyeWrap.classList.add('later');
    eyeWrap.style.opacity = '0.7';

    // 先显示"正在生成报告"——然后弹出陷阱
    $('r-type').textContent = '人格解析报告';
    $('r-sub').textContent = '正在生成…';
    $('r-desc').textContent = '';
    $('r-detail').innerHTML = '';

    setTimeout(async () => {
        // 陷阱弹窗：它索要一个从未出现过的信息
        await showTrap(
            '身份验证<br><br>请输入你母亲的姓氏<br>以解锁你的报告'
        );

        // 用户输入了什么东西——不管是什么
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const avgDelay = ans.reduce((s, a) => s + (a.delay || 0), 0) / Math.max(ans.length, 1);
        const longest = Math.max(...ans.map(a => a.delay || 0));
        const tabTime = tabStart ? Math.floor((Date.now() - tabStart) / 1000) : 0;

        // 计算类型
        let d = {EI:{e:0,i:0},SN:{s:0,n:0},TF:{t:0,f:0},JP:{j:0,p:0}};
        SEQ.forEach((q, i) => {
            if (q.sp) return;
            const v = ans[i] ? ans[i].v : q.va;
            if (q.d==='EI') v==='E'?d.EI.e++:d.EI.i++;
            else if (q.d==='SN') v==='S'?d.SN.s++:d.SN.n++;
            else if (q.d==='TF') v==='T'?d.TF.t++:d.TF.f++;
            else if (q.d==='JP') v==='J'?d.JP.j++:d.JP.p++;
        });
        const gc = (m,a,b) => m[a.toLowerCase()] >= m[b.toLowerCase()] ? a : b;
        const type = gc(d.EI,'E','I') + gc(d.SN,'S','N') + gc(d.TF,'T','F') + gc(d.JP,'J','P');
        const r = RESULTS[type] || RESULTS['INTJ'];

        // 结果内容：行为数据陈述 + 最终问题
        $('r-type').textContent = '人格解析报告';
        $('r-sub').textContent = r.s;
        $('r-desc').textContent = r.d;
        $('r-detail').innerHTML = r.x
            + `<div style="margin-top:18px;font-size:10px;line-height:2.4;opacity:0.5;">`
            + `你在第5题停顿了 ${ans[4] ? Math.round(ans[4].delay/1000) : '?'} 秒<br>`
            + `平均反应时间 ${Math.round(avgDelay/1000)} 秒<br>`
            + `最长犹豫 ${Math.round(longest/1000)} 秒<br>`
            + `切换标签页 ${tabCount} 次<br>`
            + `用时 ${elapsed} 秒`
            + (visitorLoc ? `<br>IP 归属地：${visitorLoc}` : '')
            + `</div>`
            + `<div style="margin-top:24px;font-size:11px;opacity:0.28;letter-spacing:1px;line-height:2;">`
            + `你选了 ${ans.filter(a=>a).length} 道题<br>`
            + `那么，是谁在回答这些问题？`
            + `</div>`;

        // 设备信息单独一行
        const dev = document.createElement('div');
        dev.style.cssText = 'margin-top:20px;font-size:8px;opacity:0.15;letter-spacing:0.5px;font-family:"Courier New",monospace;';
        dev.textContent = `${window.screen.width}×${window.screen.height} · ${navigator.userAgent.split(' ').slice(0,3).join(' ')}`;
        rArea.appendChild(dev);
        deviceLine.classList.add('show');
        deviceLine.textContent = window.navigator.userAgent;

        // 最后一行
        setTimeout(() => {
            const last = document.createElement('div');
            last.style.cssText = 'margin-top:20px;font-size:10px;opacity:0.2;letter-spacing:4px;text-transform:uppercase;';
            last.textContent = '你完成了';
            rArea.appendChild(last);
            setTimeout(() => {
                last.style.transition = 'opacity 3s';
                last.style.opacity = '0.45';
            }, 500);
        }, 3000);

        // 音量降低
        setTimeout(() => setBGMVolume(0.08, 5000), 3000);
        // 结果页最终jumpscare
        setTimeout(resultJumpscare, 2500);
    }, 5000); // 5秒"生成报告"后才弹出陷阱
}

function distortChar(c) {
    const r = Math.random();
    if (r < 0.10) {
        // 简繁互换
        const tc = {'为':'為','会':'會','开':'開','关':'關','来':'來','时':'時','见':'見','进':'進','远':'遠','连':'連','无':'無','对':'對','实':'實','应':'應','过':'過','变':'變','当':'當','门':'門','间':'間','区':'區','书':'書','东':'東','车':'車','广':'廣','产':'產','业':'業','学':'學','与':'與','给':'給','经':'經','总':'總','马':'馬','鸟':'鳥','鱼':'魚','虫':'蟲','龙':'龍','风雨雷电':'風雨雷電'};
        const keys = Object.keys(tc);
        const k = keys.find(k => k === c);
        if (k) return tc[k];
        const kv = Object.entries(tc).find(([k,v]) => v === c);
        if (kv) return kv[0];
    } else if (r < 0.20) {
        // 近形字替换
        const sim = {'人':'入','己':'已','士':'土','大':'太','日':'目','了':'子','八':'人','力':'刀','干':'于','今':'令','么':'公','才':'寸','下':'上','万':'方','与':'兴','天':'夫','不':'还','中':'申','手':'毛','升':'开','反':'友','天':'夫','内':'肉','父':'爻','匀':'勺','尤':'龙','仆':'仁','仇':'仅','仍':'扔','斤':'斥','爪':'瓜','伐':'代','伤':'伕','优':'优','伙':'伴','会':'云','创':'刂','杂':'九','各':'名','名':'各','后':'石','因':'囚','在':'右','夸':'夺','扣':'叩','地':'他','场':'坪','再':'冉','协':'十','压':'厂','厌':'庆','戌':'成','同':'回','因':'囚','在':'右','吃':'口','吗':'马','回':'同','团':'困','因':'囚','多':'夕','她':'他','妈':'好','收':'改','如':'好','字':'学','孙':'子','红':'虹','论':'抢','设':'没','访':'仿','尽':'层','导':'异','寿':'春','麦':'妻','寿':'春'};
        if (sim[c]) return sim[c];
    } else if (r < 0.28) {
        // 同音/近音替换
        const hom = {'你':'您','他':'它','是':'似','我':'哦','这':'这','那':'哪','有':'又','在':'再','的':'得','和':'合','就':'究','不':'木','很':'狠','都':'兜','能':'呢','会':'汇','也':'野','把':'吧','去':'趣','来':'赖','时':'十','看':'刊','出':'刍','个':'各','说':'硕','想':'响','做':'作','到':'道','很':'狠','太':'态','能':'呢','着':'者','过':'国','还':'孩','等':'蹬','再':'在','好':'号','里':'理','后':'候','被':'悲','被':'备','给':'跟','被':'北','很':'很'};
        if (hom[c]) return hom[c];
    }
    return c;
}

function startQuestionCorruption(el, qIdx) {
    if (!el) return;
    let stopped = false;
    let step = 0;

    const tick = () => {
        if (stopped) return;
        const text = el.textContent;
        const chars = text.split('');
        const op = Math.random();

        if (op < 0.20) {
            // 添字
            const pos = Math.floor(Math.random() * chars.length);
            const extras = ['的','你','它','在','了','？','。','...','…','—','「','」','...'];
            chars.splice(pos, 0, extras[Math.floor(Math.random() * extras.length)]);
        } else if (op < 0.35) {
            // 删字
            if (chars.length > 3) {
                const pos = Math.floor(Math.random() * chars.length);
                chars.splice(pos, 1);
            }
        } else if (op < 0.60) {
            // 扭曲词义：随机替换字符
            const start = Math.floor(Math.random() * Math.max(1, chars.length - 4));
            const cnt = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < cnt && start + i < chars.length; i++) {
                if (/[a-zA-Z0-9\u4e00-\u9fa5]/.test(chars[start + i])) {
                    chars[start + i] = distortChar(chars[start + i]);
                }
            }
        }

        el.textContent = chars.join('');
        step++;
        const delay = 400 + step * 80 + Math.random() * 300;
        setTimeout(tick, delay);
    };

    setTimeout(tick, 1200 + Math.random() * 600);

    // 停止条件：用户点击任意选项
    // （事件委托绑定在 qOpts 容器上——按钮每次渲染都会被 innerHTML 重建，
    //   绑在按钮上的监听器会随重建失效，导致腐坏永不停止、空循环烧 CPU）
    const stop = () => { stopped = true; };
    qOpts.addEventListener('click', stop, { once: true });
}

function observeOptionCorruption(btn, origLabel, letter) {
    let corrupted = false;
    const labelSpan = btn.querySelector('span:last-child');

    const tryCorrupt = () => {
        if (corrupted) return;
        corrupted = true;
        const text = origLabel;
        const chars = text.split('');
        const op = Math.random();

        if (op < 0.25) {
            // 添字
            const pos = Math.floor(Math.random() * Math.max(1, chars.length));
            chars.splice(pos, 0, '的');
        } else if (op < 0.45) {
            // 简繁
            const tc = {'为':'為','会':'會','开':'開','关':'關','来':'來','时':'時','对':'對','无':'無','实':'實','过':'過','当':'當','书':'書','东':'東','马':'馬','鸟':'鳥','鱼':'魚','学':'學','与':'與','经':'經','总':'總','产':'產','业':'業'};
            chars.forEach((c, i) => { if (tc[c]) chars[i] = tc[c]; });
        } else if (op < 0.65) {
            // 替换字符
            chars.forEach((c, i) => { if (Math.random() < 0.3) chars[i] = distortChar(c); });
        } else {
            // 打乱顺序
            const si = Math.floor(Math.random() * Math.max(1, chars.length - 2));
            if (si + 2 < chars.length) {
                [chars[si], chars[si+2]] = [chars[si+2], chars[si]];
            }
        }
        labelSpan.textContent = chars.join('');
    };

    // 鼠标悬停时有机会腐坏（用户犹豫时）
    btn.addEventListener('mouseenter', () => {
        if (Math.random() < 0.45) tryCorrupt();
    }, { once: true });
}
