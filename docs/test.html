<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格解析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: #f4f1ed;
    color: #2a2520;
    padding: 20px;
    transition: background 3s ease, color 3s ease;
}

/* 眼睛容器 */
#eye-wrap {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; justify-content: center; align-items: center;
    z-index: 0; opacity: 0; transition: opacity 4s ease;
}
#eye-wrap img {
    width: 180px; height: 180px;
    object-fit: contain;
    filter: brightness(0.85) contrast(1.1);
    transition: width 6s ease, height 6s ease, filter 4s ease;
}
#eye-wrap.late img {
    width: 280px; height: 280px;
}
#eye-wrap.later img {
    width: 420px; height: 420px;
}
#eye-wrap.phase-dark img {
    filter: brightness(0.4) contrast(1.4) saturate(0.8);
}

/* 自我指涉底栏 */
#meta {
    position: fixed; bottom: 8px; right: 12px;
    font-size: 8px; color: transparent;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px; pointer-events: none; z-index: 50;
    transition: color 4s; user-select: none;
}
#meta.on { color: #b0a898; }

/* 主容器 */
#app {
    max-width: 560px; width: 100%;
    padding: 48px 56px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.07);
    position: relative; z-index: 10;
    background: transparent;
    transition: border-color 3s;
}


/* 深色阶段：app容器保持文字可见 */
#app.phase-dark {
    background: rgba(0,0,0,0.18);
    border-color: rgba(255,255,255,0.06);
}

#app.phase-dark .opt-btn {
    border-color: rgba(255,255,255,0.1);
    color: #d0c0a8;
    opacity: 0.65;
}

#app.phase-dark .opt-btn:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.22);
    opacity: 0.8;
}

#app.phase-dark .q-text {
    color: #d0c0a8;
}

#app.phase-dark .q-num {
    color: #a08060;
}

#app.phase-dark .hdr {
    border-bottom-color: rgba(255,255,255,0.07);
}

#app.phase-dark .prog-wrap {
    background: rgba(255,255,255,0.04);
}

#app.phase-dark .prog-bar {
    background: rgba(255,255,255,0.18);
}

#app.phase-dark .brand,
#app.phase-dark .prog-t {
    color: #a08060;
    opacity: 0.7;
}

/* 特殊题文字 */
#app.phase-dark .sp-q {
    color: #d0c0a8;
}

/* 暗示文字 */
#app.phase-dark .hint {
    color: #b09070;
}

/* 结果页 */
#app.phase-dark .r-type,
#app.phase-dark .r-sub,
#app.phase-dark .r-desc,
#app.phase-dark .r-detail {
    color: #d0c0a8;
}

/* 头部 */
.hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.05); }
.brand { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.22; font-weight: 300; }
.prog-t { font-size: 9px; opacity: 0.22; letter-spacing: 1px; }
.prog-t em { font-style: normal; opacity: 1; }
.prog-wrap { height: 1px; background: rgba(0,0,0,0.04); border-radius: 1px; margin-bottom: 32px; overflow: hidden; }
.prog-bar { height: 100%; width: 0; background: rgba(0,0,0,0.1); border-radius: 1px; transition: width 0.6s ease, background 1s; }

/* 内容 */
.content { min-height: 240px; display: flex; flex-direction: column; justify-content: center; }

/* 欢迎 */
#welcome { text-align: center; }
#welcome h1 { font-size: 20px; font-weight: 200; letter-spacing: 8px; margin-bottom: 12px; opacity: 0.6; }
#welcome p { font-size: 11px; opacity: 0.38; line-height: 2.4; margin-bottom: 12px; }
#welcome .sub { font-size: 9px; opacity: 0.2; letter-spacing: 3px; margin-bottom: 28px; }
#start {
    background: transparent; border: 1px solid rgba(0,0,0,0.1); color: inherit;
    font-size: 10px; letter-spacing: 4px; padding: 11px 36px; cursor: pointer;
    font-family: inherit; text-transform: uppercase; font-weight: 300;
    opacity: 0.4; transition: opacity 0.3s;
}
#start:hover { opacity: 0.75; }

/* 题目 */
#q-area { display: none; }
#q-area.on { display: block; animation: in 0.5s ease; }
@keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.q-num { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.18; margin-bottom: 8px; }
.q-text { font-size: 15px; font-weight: 300; line-height: 2.1; margin-bottom: 24px; min-height: 44px; letter-spacing: 0.3px; transition: filter 0.5s, opacity 0.5s; }
.q-opts { display: flex; flex-direction: column; gap: 5px; }
.opt-btn {
    background: transparent; border: 1px solid rgba(0,0,0,0.05); border-radius: 1px;
    padding: 12px 14px; font-size: 13px; color: inherit; cursor: pointer;
    font-family: inherit; text-align: left; transition: all 0.18s;
    display: flex; align-items: center; gap: 10px;
    font-weight: 300; letter-spacing: 0.2px; opacity: 0.55;
}
.opt-btn:hover { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.12); transform: translateX(2px); opacity: 0.75; }
.opt-btn .l { width: 15px; height: 15px; border: 1px solid rgba(0,0,0,0.07); border-radius: 50%; font-size: 7.5px; display: flex; align-items: center; justify-content: center; opacity: 0.28; flex-shrink: 0; }

/* 特殊题 */
#sp-area { display: none; text-align: center; margin-top: 8px; }
#sp-area.on { display: block; }
.sp-q { font-size: 14px; font-weight: 300; color: #2a2520; line-height: 2.5; margin-bottom: 22px; letter-spacing: 0.4px; }
.sp-btn { display: none; }

/* 暗示文字 */
#hint-area { min-height: 16px; margin-top: 14px; }
.hint { font-size: 10px; color: #8a7060; opacity: 0; letter-spacing: 0.3px; font-weight: 300; font-style: italic; transition: opacity 1.2s; line-height: 1.8; }

/* 结果 */
#r-area { display: none; }
#r-area.on { display: block; animation: in 0.6s ease; }
.r-type { font-size: 9px; color: inherit; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.45; }
.r-sub { font-size: 17px; font-weight: 200; color: inherit; margin-bottom: 10px; letter-spacing: 3px; }
.r-desc { font-size: 11px; opacity: 0.3; line-height: 2; margin-bottom: 10px; }
.r-detail { border-top: 1px solid rgba(0,0,0,0.04); padding-top: 12px; font-size: 11px; opacity: 0.22; line-height: 2; }

/* 响应式 */
@media (max-width: 600px) {
    #app { padding: 32px 22px; }
    #welcome h1 { font-size: 16px; }
    .q-text { font-size: 13px; }
    .opt-btn { font-size: 12px; }
    #eye-wrap img { width: 120px !important; height: 120px !important; }
}
</style>
</head>
<body>

<div id="eye-wrap">
    <img src="../resource/eye.webp" alt="" id="eye-img">
</div>
<div id="meta"></div>

<div id="app">
    <div class="hdr">
        <div class="brand">MindType</div>
        <div class="prog-t">第 <em id="q-n">0</em> / <span id="q-t">40</span> 题</div>
    </div>

    <div class="content">

        <div id="welcome">

            <p>通过 40 道题目，揭示你的认知密码。<br>请根据直觉作答，不必思考太久。</p>
            <p class="sub">约 13 分钟 · 内心诚实</p>
            <button id="start">开始测试 →</button>
        </div>

        <div id="q-area">

            <div class="q-text" id="q-txt">加载中...</div>
            <div class="q-opts" id="q-opts"></div>
            <div id="sp-area">
                <div class="sp-q" id="sp-q"></div>
                <button class="sp-btn" id="sp-btn">我读完了</button>
            </div>
            <div id="hint-area"></div>
        </div>

        <div id="r-area">
            <div class="r-type" id="r-type">——</div>
            <div class="r-sub" id="r-sub">——</div>
            <div class="r-desc" id="r-desc">——</div>
            <div class="r-detail" id="r-detail"></div>
        </div>

</div>

// 特殊题：文字恐怖谷
// 手法：它知道/自我递归/第三人突现/几乎正确的错误/时间错位/反刍重复

// 眼睛 jumpscare
function eyeJumpscare() {
    const el = eyeImg;
    const wrap = eyeWrap;
    const computed = getComputedStyle(el);
    // 保存原始状态
    const origW = computed.width;
    const origH = computed.height;
    const origPos = { top: wrap.style.top, left: wrap.style.left, opacity: wrap.style.opacity };
    // 先闪红，再闪白
    flash('#7a0000', 40);
    setTimeout(() => flash('#fff', 60), 45);
    // 眼睛移到正中，瞬间放大
    wrap.style.transition = 'none';
    wrap.style.top = '50%';
    wrap.style.left = '50%';
    wrap.style.transform = 'translate(-50%,-50%)';
    el.style.transition = 'width 0.06s, height 0.06s';
    el.style.width = '98vw';
    el.style.height = '98vh';
    el.style.objectFit = 'cover';
    wrap.style.opacity = '1';
    // 低频冲击
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.frequency.value = 40;
        osc.type = 'sawtooth';
        g.gain.setValueAtTime(0.6, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
        setTimeout(() => ctx.close(), 500);
    } catch(e) {}
    // 300ms后恢复
    setTimeout(() => {
        wrap.style.transition = 'all 0.7s ease';
        wrap.style.top = '';
        wrap.style.left = '';
        wrap.style.transform = '';
        el.style.transition = 'width 0.6s ease, height 0.6s ease';
        el.style.width = origW;
        el.style.height = origH;
        el.style.objectFit = 'contain';
        setTimeout(() => {
            wrap.style.transition = '';
            el.style.transition = '';
        }, 800);
    }, 300);
}

// 文字恐怖谷：只腐坏普通字母，保持HTML结构，让它看起来像编码坏了
function textCorrupt(el) {
    if (!el) return;
    const orig = el.innerHTML;
    const corrupt = () => {
        const bad = orig.replace(/[a-zA-Z0-9]/g, c => {
            if (Math.random() < 0.07) {
                const map = {
                    'e':'3','i':'1','a':'4','o':'0','s':'5',
                    't':'7','l':'1','r':'2','n':'h','h':'n',
                    'E':'3','I':'1','A':'4','O':'0','S':'5',
                    'T':'7','L':'1','R':'2','N':'H','H':'N'
                };
                return map[c] !== undefined ? map[c] : c;
            }
            return c;
        });
        el.innerHTML = bad;
        setTimeout(() => {
            el.innerHTML = orig;
            setTimeout(corrupt, 600 + Math.random() * 1200);
        }, 1500 + Math.random() * 1000);
    };
    setTimeout(corrupt, 2000);
}

// 反刍暗示：重复但每遍少一个字
let echoText = '';
function echo(text) {
    echoText = text;
    const el = document.createElement('div');
    el.style.cssText = 'font-size:10px;color:#8a7060;opacity:0;letter-spacing:0.3px;font-weight:300;font-style:italic;transition:opacity 1s;margin-top:8px;text-align:center;';
    el.textContent = text;
    hintArea.appendChild(el);
    requestAnimationFrame(() => el.style.opacity = '0.4');
    let times = 0;
    const interval = setInterval(() => {
        times++;
        el.textContent = text.slice(0, text.length - times * 2);
        if (el.textContent.length <= 3) {
            clearInterval(interval);
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 1200);
        }
    }, 1200);
}

// 效果池（含 jumpscare 眼睛）
const SP_EFFECTS = [
    () => { flash('#8a0000', 80); },                        // 闪红
    () => { flash('#fff', 60); },                            // 闪白
    () => { shake(250); },                                   // 屏幕抖动
    () => { glitchText(); },                                 // 文字碎裂
    () => { tear(); },                                       // 画面撕裂
    () => { silenceBgm(600); },                              // BGM静音
    () => { eyePulse(); },                                   // 眼睛放大（轻量）
    () => { bgDrop(); },                                     // 背景掉黑
    () => { playNoise(); },                                  // 低频噪音
    () => { flash('#000', 50); },                            // 闪黑
    () => { eyeJumpscare(); },                               // 眼睛jumpscare
    () => { textCorrupt(spQEl); },                           // 文字腐坏
    () => { echo('你还在这里。'); },                         // 反刍文字
    () => { echo('你回来了。'); },                           // 反刍
];

function triggerSpecialEffect() {
    // 第7题（索引6）和第10题（索引9）时，眼睛做jumpscare
    const spIdx = Math.floor(cur / 4); // 0~9
    if (spIdx === 6 || spIdx === 9) {
        eyeJumpscare();
        return;
    }
    const fns = SP_EFFECTS.slice(0, 11); // 不含额外特效

}

// ================================================================
// 音频
// ================================================================
function startBGM() {
    bgm.volume = 0;
    bgm.play().catch(() => {});
    // 渐入
    let vol = 0;
    const fadeIn = setInterval(() => {
        vol = Math.min(0.45, vol + 0.015);
        bgm.volume = vol;
        if (vol >= 0.45) clearInterval(fadeIn);
    }, 200);
}

function setBGMVolume(v, dur = 2000) {
    const now = bgm.volume;
    const step = (v - now) / (dur / 50);
    const fade = setInterval(() => {
        bgm.volume = Math.max(0, Math.min(1, bgm.volume + step));
        if ((step > 0 && bgm.volume >= v) || (step < 0 && bgm.volume <= v)) {
            bgm.volume = v;
            clearInterval(fade);
        }
    }, 50);
}

// ================================================================
// 特殊题效果：随机触发一种
// ================================================================

function flash(color, dur) {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;inset:0;background:${color};z-index:9999;pointer-events:none;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur);
}

function shake(dur) {
    const orig = document.body.style.transform;
    const t = setInterval(() => {
        document.body.style.transform = `translate(${(Math.random()-0.5)*4}px,${(Math.random()-0.5)*3}px)`;
    }, 30);
    setTimeout(() => {
        clearInterval(t);
        document.body.style.transform = orig;
    }, dur);
}

function glitchText() {
    const el = qTxt;
    const orig = el.textContent;
    el.style.transition = 'opacity 0.08s';
    el.style.opacity = '0';
    setTimeout(() => {
        el.textContent = orig.split('').map(c => Math.random()<0.3 ? '' : c).join('');
        el.style.opacity = '1';
        el.style.transition = 'opacity 0.4s';
        setTimeout(() => {
            el.textContent = orig;
        }, 300);
    }, 120);
}

function tear() {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;inset:0;z-index:9998;pointer-events:none;background:linear-gradient(to right,transparent 0%,rgba(255,255,255,0.06) 50%,transparent 100%);transform:skewX(-5deg) scaleY(0.3);';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 150);
}

function silenceBgm(dur) {
    const orig = bgm.volume;
    bgm.volume = 0;
    setTimeout(() => {
        // 恢复时制造一个突兀感
        bgm.volume = 0.02;
        setTimeout(() => bgm.volume = orig, 80);
    }, dur);
}

function eyePulse() {
    const el = eyeImg;
    const computed = getComputedStyle(el);
    const origW = computed.width;
    const origH = computed.height;
    el.style.transition = 'width 0.07s, height 0.07s';
    el.style.width = '420px'; el.style.height = '420px';
    setTimeout(() => {
        el.style.transition = 'width 0.6s ease, height 0.6s ease';
        el.style.width = origW; el.style.height = origH;
    }, 120);
}

function bgDrop() {
    const origBg = document.body.style.background;
    document.body.style.transition = 'background 0.05s';
    document.body.style.background = '#000';
    setTimeout(() => {
        document.body.style.transition = 'background 0.4s';
        document.body.style.background = origBg;
    }, 180);
}

// 低频噪音（保留为一种效果）
function playNoise() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufSize = ctx.sampleRate * 3;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 600;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.8);
        g.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 2.2);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.5);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 3.5);
        setTimeout(() => ctx.close(), 4000);
    } catch(e) {}
}

// ================================================================
// 暗示文字

let activeHint = null;

function showHint(text, duration = 5000) {
    // 移除旧的
    if (activeHint) activeHint.remove();
    const el = document.createElement('div');
    el.className = 'hint';
    el.innerHTML = text;  // 支持HTML换行
    hintArea.innerHTML = '';
    hintArea.appendChild(el);
    requestAnimationFrame(() => { el.style.opacity = '0.55'; });
    activeHint = el;
    setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => { if (el.parentNode) el.remove(); }, 1400);
    }, duration);
}

function clearHint() {
    if (activeHint) {
        activeHint.style.opacity = '0';
        setTimeout(() => { if (activeHint && activeHint.parentNode) activeHint.remove(); }, 200);
        activeHint = null;
    }
}

// ================================================================
// 鼠标监控
// ================================================================
document.addEventListener('mousemove', e => {
    const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    speedBuf.push(Math.sqrt(dx*dx + dy*dy));
    if (speedBuf.length > 10) speedBuf.shift();
    lastMX = e.clientX; lastMY = e.clientY;
    lastMove = Date.now();
    mouseStill = 0;
});

setInterval(() => {
    mouseStill = Math.floor((Date.now() - lastMove) / 1000);
    if (!started || cur >= TOTAL) return;
    if (ph >= 4 && mouseStill > 8) {
        qTxt.style.filter = `blur(${Math.min(mouseStill - 7, 3)}px)`;
    }
    if (mouseStill > 14) {
        qTxt.style.filter = '';
    }
}, 1000);

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        tabStart = Date.now();
        tabCount++;
    } else {
        if (tabStart && started) {
            const dur = Math.round((Date.now() - tabStart) / 1000);
            setTimeout(() => {
                showHint('你刚才离开了 ' + dur + ' 秒。', 4500);
            }, 400);
        }
        tabStart = 0;
    }
});

document.addEventListener('mouseover', e => {
    if (e.target.classList.contains('opt-btn') && SEQ[cur] && !SEQ[cur].sp) {
        const isA = e.target.querySelector('.l').textContent === 'A';
        if (!hoverCount[cur]) hoverCount[cur] = { a: 0, b: 0 };
        hoverCount[cur][isA ? 'a' : 'b']++;
    }
});

// ================================================================
// 阶段
// ================================================================
function phVal() { return Math.min(9, Math.floor(cur / 4)); }

function applyPhase(p) {
    ph = p;

    // 背景色：米色 → 暖灰 → 深灰 → 近黑
    const bgs = ['#f4f1ed','#e8e3dc','#ddd6ca','#c8bfb2','#a89888','#6a5a50','#2e2420','#100c0a','#050302','#000'];
    const fgs = ['#2a2520','#3a3530','#4a4038','#5a5048','#e8e0d4','#d0c8bc','#c8b89a','#b0a080','#a09080','#c0b0a0'];
    document.body.style.background = bgs[p] || bgs[0];
    document.body.style.color = fgs[p] || fgs[0];

    // app容器深色class
    const appEl = $('app');
    appEl.classList.remove('phase-dark');
    if (p >= 6) appEl.classList.add('phase-dark');

    // 眼睛
    if (p >= 2) eyeWrap.style.opacity = '1';
    if (p >= 5) eyeWrap.classList.add('late');
    if (p >= 7) { eyeWrap.classList.add('later'); eyeWrap.classList.add('phase-dark'); }
    if (p >= 8) { eyeWrap.style.opacity = '0.6'; }

    // 阶段6+：眼睛开始"活着"——轻微漂移
    if (p >= 6) startEyeLife();

    // 阶段7+：元信息栏文字开始变化
    if (p >= 7) {
        meta.style.letterSpacing = '1px';
    }

    // 元信息栏
    if (p >= 3) meta.classList.add('on');

    // 暗示
    if (started) maybeShowHint();
}

// 眼睛"生命"：轻微的呼吸/漂移
let eyeLifeInterval = null;
function startEyeLife() {
    if (eyeLifeInterval) return;
    eyeLifeInterval = setInterval(() => {
        const drift = (Math.random() - 0.5) * 8;
        const driftY = (Math.random() - 0.5) * 6;
        eyeWrap.style.transform = `translate(calc(-50% + ${drift}px), calc(-50% + ${driftY}px))`;
        setTimeout(() => {
            if (!eyeWrap.style.transform) return;
            eyeWrap.style.transform = 'translate(-50%,-50%)';
        }, 400);
    }, 1800 + Math.random() * 2000);
}

// ================================================================
// 渲染题目
// ================================================================
function renderQ(idx) {
    applyPhase(phVal());
    const q = SEQ[idx];
    if (!q) return;

    clearHint();
    qN.textContent = idx + 1;
    qTEl.textContent = TOTAL;
    prog.style.width = `${(idx / TOTAL) * 100}%`;
    qLbl.textContent = `问题 ${idx + 1}`;
    qTxt.style.filter = '';

    spArea.classList.remove('on');
    qOpts.style.display = 'flex';

    if (q.sp) {
        qOpts.style.display = 'none';
        spArea.classList.add('on');
        spQEl.innerHTML = q.t;
        qTxt.textContent = '';
        qArea.classList.add('on');
        welcome.style.display = 'none';
        rArea.classList.remove('on');
        // 特殊题：随机触发一种效果
        triggerSpecialEffect();
        setTimeout(() => {
            cur++;
            if (cur < TOTAL) renderQ(cur);
            else showResult();
        }, 4000);
        return;
    }

    qOpts.style.display = 'flex';
    spArea.classList.remove('on');
    qTxt.textContent = q.t;

    let a = q.a, b = q.b;

    qOpts.innerHTML = '';
    [{l:'A',label:a,v:q.va},{l:'B',label:b,v:q.vb}].forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="l">${o.l}</span><span>${o.label}</span>`;
        btn.onclick = () => handleAns(o.v, o.label, o.l);
        qOpts.appendChild(btn);
    });

    qArea.classList.add('on');
    welcome.style.display = 'none';
    rArea.classList.remove('on');
}

// ================================================================
// 答案处理
// ================================================================
function handleAns(v, label, ltr) {
    const delay = Date.now() - lastClick;
    lastClick = Date.now();
    ans[cur] = { v, label, ltr, delay };

    // 悬停暗示：你本来想选另一个
    const h = hoverCount[cur];
    if (h && ph >= 5 && !wrongChoiceShown) {
        const first = h.a >= h.b ? 'A' : 'B';
        const chosen = ltr;
        if (first !== chosen && Math.random() < 0.4) {
            const wrongLabel = first === 'A' ? SEQ[cur].a : SEQ[cur].b;
            showHint('你本来想选 "' + wrongLabel + '"。', 5000);
            wrongChoiceShown = true;
        }
    }

    // 犹豫暗示
    if (delay > 4000 && ph >= 3) {
        showHint('你在这里停了很久。', 4000);
    }

    // 快速点击：恐怖质问 + 红闪
    if (delay < 500 && ph >= 4) {
        const q = [
            '真的想了吗？',
            '真的想了吗？？',
            '真的想了吗？？？',
            '你真的在想吗？',
            '还是只是在点？',
            '这三个字，你真的读了吗？',
            '想了。再想一遍。',
            '你选的。不是系统选的。',
        ];
        flash('#6a0000', 120);
        showHint(q[Math.floor(Math.random() * q.length)], 2800);
        wrongChoiceShown = false; // 重置，允许再次触发
    }

    cur++;
    if (cur < TOTAL) renderQ(cur);
    else showResult();
}

// ================================================================
// 结果页
// ================================================================
function showResult() {
    applyPhase(9);
    clearHint();
    qArea.classList.remove('on');
    welcome.style.display = 'none';
    rArea.classList.add('on');

    // 计算类型
    let d = {EI:{e:0,i:0},SN:{s:0,n:0},TF:{t:0,f:0},JP:{j:0,p:0}};
    SEQ.forEach((q, i) => {
        if (q.sp) return;
        const v = ans[i] ? ans[i].v : q.va;
        if (q.d==='EI') v==='E'?d.EI.e++:d.EI.i++;
        else if (q.d==='SN') v==='S'?d.SN.s++:d.SN.n++;
        else if (q.d==='TF') v==='T'?d.TF.t++:d.TF.f++;
        else if (q.d==='JP') v==='J'?d.JP.j++:d.JP.p++;
    });
    const gc = (m,a,b) => m[a.toLowerCase()] >= m[b.toLowerCase()] ? a : b;
    const type = gc(d.EI,'E','I') + gc(d.SN,'S','N') + gc(d.TF,'T','F') + gc(d.JP,'J','P');
    const r = RESULTS[type] || RESULTS['INTJ'];

    $('r-type').textContent = '人格解析报告';
    $('r-sub').textContent = r.s;
    $('r-desc').textContent = r.d;
    $('r-detail').innerHTML = r.x;
    prog.style.width = '100%';

    // 眼睛变大
    eyeWrap.classList.add('later');
    eyeWrap.style.opacity = '0.7';

    // 设备信息
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const dev = document.createElement('div');
    dev.style.cssText = 'margin-top:20px;font-size:8px;opacity:0.18;letter-spacing:0.5px;font-family:"Courier New",monospace;';
    dev.textContent = `${window.screen.width}×${window.screen.height} · ${navigator.userAgent.split(' ').slice(0,3).join(' ')} · 用时${elapsed}秒 · 离开${tabCount}次`;
    rArea.appendChild(dev);

    // 最后一行
    setTimeout(() => {
        const last = document.createElement('div');
        last.style.cssText = 'margin-top:20px;font-size:10px;opacity:0.2;letter-spacing:4px;text-transform:uppercase;';
        last.textContent = '你完成了';
        rArea.appendChild(last);
        setTimeout(() => {
            last.style.transition = 'opacity 3s';
            last.style.opacity = '0.45';
        }, 500);
    }, 4000);

    // 音量降低
    setTimeout(() => setBGMVolume(0.08, 5000), 3000);
}

// ================================================================
// 自我指涉
// ================================================================
setInterval(() => {
    if (!started || ph < 3) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = String(elapsed % 60).padStart(2, '0');
    const avgSpd = speedBuf.length ? Math.round(speedBuf.reduce((a,b)=>a+b,0)/speedBuf.length) : 0;

    // 阶段7+：meta文字开始恐怖谷
    if (ph >= 7) {
        const glitched = `${window.screen.width}×${window.screen.height} · ${min}:${sec} · 静止${mouseStill}s · 离开${tabCount}次`.split('').map(c => {
            if (Math.random() < 0.05) {
                const m = {'0':'O','1':'l','3':'E','5':'S','7':'T','o':'0','l':'1'};
                return m[c] !== undefined ? m[c] : c;
            }
            return c;
        }).join('');
        meta.textContent = glitched;
    } else {
        meta.textContent = `${window.screen.width}×${window.screen.height} · ${min}:${sec} · 静止${mouseStill}s · 速度${avgSpd} · 离开${tabCount}次`;
    }
}, 2500);

        renderQ(0);
    }, 100);
};

qTEl.textContent = TOTAL;

prog.style.width = '0%';

document.body.style.opacity = '0';
setTimeout(() => {
    document.body.style.transition = 'opacity 1.5s';
