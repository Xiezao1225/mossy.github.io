<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>心理健康自评</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
html { -webkit-text-size-adjust:100%; }
button { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
body {
  background:#fafafa;
  color:#000;
  font-family:'Songti SC','SimSun','Noto Serif SC','Microsoft YaHei',serif;
  -webkit-font-smoothing:antialiased;
  transition:background .8s;
}
.screen {
  position:fixed; top:0; left:0; right:0; bottom:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px;
}
#quiz { cursor:none; }
.hidden { display:none !important; }

button {
  font-family:inherit; cursor:pointer;
}
.btn {
  background:transparent; color:#000;
  border:1px solid #000;
  padding:11px 42px;
  font-size:15px; letter-spacing:4px;
  transition:background .2s, color .2s;
}
.btn:hover { background:#000; color:#fff; }

#consent h1 {
  font-weight:600; letter-spacing:8px;
  font-size:27px; margin-bottom:22px;
  text-align:center;
}
#consent .warn {
  font-size:13px; line-height:1.9; text-align:center;
  max-width:420px; margin-bottom:10px;
}
#consent .tiny {
  font-size:11px; color:#888; line-height:1.8; text-align:center;
  max-width:420px; margin-bottom:34px;
}
#consent .actions { display:flex; gap:18px; }

#progress {
  position:fixed; top:16px; right:20px;
  font-size:11px; color:#bbb; letter-spacing:2px;
  user-select:none;
}

#qtext {
  font-size:22px; line-height:2; text-align:center;
  max-width:560px; margin:26px 0 30px;
}
#qtext .sub {
  display:block; margin-top:22px;
  font-size:12px; color:#a9a9a9; letter-spacing:1px;
}
#options { width:340px; max-width:92vw; }
.opt {
  display:block; width:100%;
  border:1px solid #000; margin:11px 0;
  padding:13px 18px; font-size:15px;
  background:transparent; color:#000; text-align:center;
  transition:background .18s, color .18s;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
@media (max-width:640px) {
  .screen { padding:20px; justify-content:flex-start; padding-top:72px; overflow-y:auto; }
  #qtext { font-size:19px; line-height:1.9; margin:14px 0 20px; }
  .opt { padding:16px 14px; font-size:16px; }
  .btn { padding:12px 34px; }
  #progress { top:12px; right:14px; }
  #scare .big { font-size:26px; }
}
.opt:hover, .opt.sel { background:#000; color:#fff; }
#next {
  margin-top:28px; padding:10px 44px;
}
#next:disabled { opacity:.25; cursor:default; }
#next:disabled:hover { background:transparent; color:#000; }

.cl-line {
  font-size:20px; font-weight:600;
  line-height:1.55; text-align:center;
  white-space:pre; user-select:none;
}

#scare { background:#000; color:#fff; overflow:hidden; }
#scare .big {
  font-size:34px; letter-spacing:6px;
  text-align:center; line-height:1.8;
}
#scare.flash { filter:invert(1); }
.noise-line { white-space:nowrap; line-height:1.1; user-select:none; color:#fff; }

#blank .cursor {
  display:inline-block; width:2px; height:26px;
  background:#000; animation:blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity:0; } }

#red { background:#000; }
#red .red {
  color:#c00; font-size:24px; letter-spacing:10px; text-align:center;
}
#red .tiny {
  margin-top:26px; font-size:11px; color:#555; letter-spacing:2px;
}

#watchLayer {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.72); z-index:99;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .35s;
}
#watchLayer.on { opacity:1; pointer-events:none; }
#watchLayer img {
  width:150px; height:150px; object-fit:cover;
  border-radius:50%; mix-blend-mode:screen;
  animation:eyeGlow 1.2s ease-in-out infinite alternate;
}
@keyframes eyeGlow {
  from { filter:brightness(.9) saturate(1); }
  to { filter:brightness(1.6) saturate(1.5); }
}
/* 彩蛋支线：图片跳脸换成 resource/help.jpg，并铺满整屏 */
#watchLayer.egg { background:#000; }
#watchLayer.egg img {
  width:100%; height:100%; border-radius:0; object-fit:contain;
  mix-blend-mode:normal;
  animation:faceIn .16s steps(2) 1;
}
@keyframes faceIn {
  from { filter:invert(1) contrast(1.5); }
  to { filter:none; }
}

#fauxDeath {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:#fff; z-index:98; display:flex;
  align-items:center; justify-content:center; opacity:0;
  pointer-events:none; transition:opacity .1s;
}
#fauxDeath.on { opacity:1; }
#fauxDeath .fd-line {
  color:#000; font-size:15px; letter-spacing:3px;
  animation:blink 1.2s step-end infinite;
}

#reportBox {
  margin-top:22px; padding:16px 20px;
  border:1px solid #000; max-width:420px;
  font-size:13px; line-height:2; text-align:center;
  background:#fff;
}
#reportBox .r-line { letter-spacing:1px; }
#reportBox .r-warn { color:#a00; font-weight:600; letter-spacing:3px; }

body.skip-shake { transform:translateX(2px); }
body.skew-shake { animation:skewJitter .3s ease-out; }
@keyframes skewJitter {
  0% { transform:translate(0,0) skewX(0); }
  25% { transform:translate(-2px,0) skewX(.4deg); }
  50% { transform:translate(2px,1px) skewX(-.6deg); }
  75% { transform:translate(-1px,0) skewX(.3deg); }
  100% { transform:translate(0,0) skewX(0); }
}

.opt-dodge { transition:transform .12s ease-out; }
.opt.ghosted { border-color:#d0d0d0; color:#d0d0d0; transition:border-color .12s, color .12s, transform .12s ease-out; }



#qtext .swap-flash { color:#900; }
#qtext .swap-note { color:#a00; }

#qtyWrap { margin-top:16px; text-align:center; }
#qtyWrap input {
  font-family:inherit; font-size:15px; text-align:center;
  border:1px solid #000; padding:10px 14px; width:240px; max-width:80vw;
  border-radius:0; outline:none;
}
#qtyWrap .dismissed { color:#a00; font-size:13px; letter-spacing:3px; margin-top:10px; }

#blackFlash {
  position:fixed; inset:0; background:#000; z-index:97;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
}
#blackFlash.on { opacity:1; }
#blackFlash span { color:#fff; font-size:26px; letter-spacing:8px; white-space:pre; }

/* ===== d3rlord3 easter egg（标题界面输入 d3rlord3 触发） ===== */
#egg {
  position:fixed; inset:0; z-index:120;
  background:rgba(8,8,10,.95); color:#e8c547;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:34px 24px; text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .7s;
  overflow-y:auto;
}
#egg.on { opacity:1; pointer-events:auto; }
#egg.flash { filter:invert(1); }
#egg .sign {
  width:78px; height:78px; flex:none;
  margin-bottom:28px; opacity:.85;
  animation:signSpin 34s linear infinite;
}
#egg .sign ellipse, #egg .sign circle { fill:none; stroke:#e8c547; stroke-width:2; }
#egg .sign .dot { fill:#e8c547; stroke:none; }
@keyframes signSpin { to { transform:rotate(360deg); } }
#eggText { max-width:540px; }
#egg .egg-line {
  font-size:14px; line-height:2.3; letter-spacing:1.5px;
  opacity:.94; word-break:break-word;
}
#egg .egg-line + .egg-line { margin-top:9px; }
#egg .lead { font-size:15px; letter-spacing:4px; color:#f2d879; }
#egg .en { font-family:Georgia,'Times New Roman',serif; letter-spacing:2px; }
#eggText .egg-line:last-child::after {
  content:''; display:inline-block; width:7px; height:14px; margin-left:4px;
  background:#e8c547; vertical-align:-2px;
  animation:blink 1s step-end infinite;
}
#egg .egg-code {
  margin-top:30px; font-size:10px; letter-spacing:3px;
  color:#6b5a1c; line-height:2;
}
#egg .egg-hint {
  position:fixed; left:0; right:0; bottom:20px;
  font-size:10px; letter-spacing:4px; color:#4d4212; text-align:center;
}
@media (max-width:640px), (max-height:560px) {
  #egg { justify-content:flex-start; padding-top:54px; padding-bottom:56px; }
  #egg .sign { width:60px; height:60px; margin-bottom:20px; }
  #egg .egg-line { font-size:13px; line-height:2.1; }
}

/* ===== 彩蛋第三阶段：色调变化 / 震动 / 屏幕碎裂 ===== */
body.kiy-final { background:#12100a; color:#e8c547; }
body.kiy-final .opt { border-color:#8a7a2a; color:#e8c547; }
body.kiy-final .opt:hover, body.kiy-final .opt.sel { background:#e8c547; color:#12100a; }
body.kiy-final .opt.ghosted { border-color:#4d4212; color:#4d4212; }
body.kiy-final .btn { border-color:#8a7a2a; color:#e8c547; }
body.kiy-final .btn:hover { background:#e8c547; color:#12100a; }
body.kiy-final .btn:disabled { opacity:.3; }
body.kiy-final .btn:disabled:hover { background:transparent; color:#e8c547; }
body.kiy-final #progress { color:#5a4c14; }
body.kiy-final #quiz { cursor:pointer; }
body.kiy-final #qtext .sub { color:#8a7a2a; }
body.kiy-final #qtext .swap-flash, body.kiy-final #qtext .swap-note { color:#f2d879; }
body.kiy-final #qtyWrap input { border-color:#8a7a2a; color:#e8c547; background:transparent; }
body.kiy-final #qtyWrap .dismissed { color:#e8c547; }

#crack {
  position:fixed; inset:0; z-index:110;
  pointer-events:none; opacity:0; transition:opacity .5s;
}
#crack.on { opacity:1; }
#crack svg { display:block; width:100%; height:100%; }
#crack path {
  fill:none; stroke:#f2d879; stroke-width:.3; stroke-linecap:round; stroke-linejoin:round;
  opacity:0; transition:opacity .28s;
}
#crack path.on { opacity:.85; }
#crack path.web { stroke:#ffeaa6; stroke-width:.2; }

#shatterFlash {
  position:fixed; inset:0; z-index:111; background:#f6f2df;
  opacity:0; pointer-events:none; transition:opacity .06s;
}
#shatterFlash.on { opacity:1; }

body.shake-hard { animation:hardShake .5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes hardShake {
  10%, 90% { transform:translate3d(-3px,1px,0) rotate(-.25deg); }
  20%, 80% { transform:translate3d(7px,-2px,0) rotate(.4deg); }
  30%, 50%, 70% { transform:translate3d(-10px,3px,0) rotate(-.6deg); }
  40%, 60% { transform:translate3d(10px,-3px,0) rotate(.6deg); }
}

.egg-ghost {
  display:block; margin-top:14px; font-size:11px; letter-spacing:6px;
  color:#e8c547; opacity:0; transition:opacity 1.4s;
}
.egg-ghost.on { opacity:.55; }

/* ===== 彩蛋终章：黑白锁屏 → 雪花屏 → 黑屏两行 → 文字跳脸 → 最后一词 → 雪花屏 ===== */
body.bw { background:#0c0c0c; }
body.bw #quiz, body.bw #crack, body.bw #progress { filter:grayscale(1); }

#finalSeq { position:fixed; inset:0; z-index:113; display:none; overflow:hidden; }
#finalSeq.on { display:block; }

/* 黑屏 + 两行（字号加大） */
#fsSlow { position:absolute; inset:0; display:none; background:#000; overflow:hidden; }
#fsSlow.on { display:block; }
#finalSeq .fs-line {
  position:absolute; font-size:34px; line-height:1.9;
  letter-spacing:5px; opacity:0; transition:opacity 2.6s ease-in;
}
#finalSeq .fs-left { left:7%; top:29%; text-align:left; color:#f4f4f4; }
#finalSeq .fs-right { right:7%; top:60%; text-align:right; color:#e8c547; }
#finalSeq .fs-line.show { opacity:1; }

/* 雪花屏（低分辨率画布拉伸，看得见颗粒） */
#fsSnow {
  position:absolute; inset:0; z-index:5; display:none;
  width:100%; height:100%; background:#000;
  image-rendering:pixelated;
}
#fsSnow.on { display:block; }

/* 白底绿字文字跳脸 */
#fsFlash {
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center; text-align:center;
  background:#fff; color:#0a8a3c;
  font-size:24px; line-height:2; letter-spacing:4px; padding:40px;
}
#fsFlash.on { display:flex; animation:fsJump .12s steps(2) 1; }
@keyframes fsJump { from { filter:invert(1); } to { filter:none; } }

/* 黄底黑字：最后一词，直接显示 */
#finalWaves {
  position:absolute; inset:0; display:none;
  align-items:center; justify-content:center; text-align:center;
  background:#e8c547; color:#0a0a0a; padding:30px;
}
#finalWaves.on { display:flex; }
#finalWaves .fw-line { font-size:42px; font-weight:600; letter-spacing:6px; line-height:1.5; }

@media (max-width:640px) {
  #finalSeq .fs-line { font-size:22px; letter-spacing:3px; }
  #fsFlash { font-size:18px; }
  #finalWaves .fw-line { font-size:26px; letter-spacing:4px; }
}
</style>
</head>
<body>

<div id="consent" class="screen">
  <h1>心理健康自评</h1>
  <p class="warn">本问卷用于心理状况的简易自查，请如实作答。</p>
  <p class="tiny">
    包含强烈的心理压迫内容、异常文字与声音刺激。<br>
    未成年人与心理状态脆弱者请勿参与。<br>
    如感到任何不适，可按 Esc 随时退出。
  </p>
  <div class="actions">
    <button id="startBtn" class="btn">开始作答</button>
    <button id="exitBtn" class="btn">退出</button>
  </div>
  <p class="egg-ghost" id="eggGhost">你向左转了吗</p>
</div>

<div id="progress" class="hidden"></div>

<div id="quiz" class="screen hidden">
  <div id="qtext"></div>
  <div id="options"></div>
  <button id="next" class="btn" disabled>下一题</button>
</div>

<div id="blank" class="screen hidden">
  <span class="cursor"></span>
</div>

<div id="climax" class="screen hidden"></div>

<div id="scare" class="screen hidden"></div>

<div id="red" class="screen hidden"></div>

<div id="egg">
  <svg class="sign" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="7"/>
    <ellipse cx="50" cy="27" rx="9" ry="19"/>
    <ellipse cx="50" cy="27" rx="9" ry="19" transform="rotate(120 50 50)"/>
    <ellipse cx="50" cy="27" rx="9" ry="19" transform="rotate(240 50 50)"/>
    <circle cx="50" cy="50" r="43" stroke-dasharray="2 6"/>
    <circle class="dot" cx="50" cy="7" r="3"/>
  </svg>
  <div id="eggText"></div>
  <div class="egg-code">档案状态：失联　·　最后活动位置：未知</div>
  <div id="eggHint" class="egg-hint hidden">按 Esc 返回</div>
</div>

<div id="watchLayer"><img src="resource/eye.webp" alt=""></div>
<div id="fauxDeath"><span class="fd-line">系统无响应</span></div>

<div id="blackFlash"><span>■■■■</span></div>

<div id="crack"><svg id="crackSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>
<div id="shatterFlash"></div>

<div id="finalSeq">
  <div id="fsSlow"></div>
  <canvas id="fsSnow" width="240" height="135"></canvas>
  <div id="fsFlash"></div>
  <div id="finalWaves"></div>
</div>

function probeSpeech(cb) {
  if (!('speechSynthesis' in window)) { cb(false); return; }
  var V = window.speechSynthesis;
  var resolved = false;
  function done(ok) { if (!resolved) { resolved = true; cb(ok); } }
  try {
    var voices = (V.getVoices ? V.getVoices() : []);
    if (voices.length) { done(true); return; }
  } catch (e) {}
  try {
    var u = new SpeechSynthesisUtterance(' ');
    u.onstart = function () { done(true); };
    u.onend = function () { done(true); };
    u.onerror = function () {};
    V.speak(u);
  } catch (e) {}
  if (V.addEventListener) {
    var h = function () {
      try {
        if (V.getVoices && V.getVoices().length) {
          if (V.removeEventListener) V.removeEventListener('voiceschanged', h);
          done(true);
        }
      } catch (e) {}
    };
    V.addEventListener('voiceschanged', h);
  }
  setT(function () { done(false); }, 800);
}

function makeDistortionCurve(k) {
  var n = 44100, curve = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    var x = i * 2 / n - 1;
    curve[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

function initAudio() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || ctx) return;
  ctx = new AC();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(ctx.destination);

  whisperDelay = ctx.createDelay(1.0);
  whisperDelay.delayTime.value = 0.4;
  var whisperFb = ctx.createGain();
  whisperFb.gain.value = 0.35;
  whisperDelay.connect(whisperFb);
  whisperFb.connect(whisperDelay);
  whisperDelay.connect(masterGain);

  lowpass = ctx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 800;

  shaper = ctx.createWaveShaper();
  shaper.curve = makeDistortionCurve(28);
  lowpass.connect(shaper);

  bgmGain = ctx.createGain();
  bgmGain.gain.value = 0;
  shaper.connect(bgmGain);
  bgmGain.connect(masterGain);

  lowOscGain = ctx.createGain();
  lowOscGain.gain.value = 0;
  lowOscGain.connect(lowpass);

  lowOsc = ctx.createOscillator();
  lowOsc.type = 'sine';

  pitchLfo = ctx.createOscillator();

  pitchLfoGain = ctx.createGain();

  dissonanceOsc = ctx.createOscillator();
  dissonanceOsc.type = 'sine';
  dissonanceOsc.frequency.value = 58;
  dissonanceGain = ctx.createGain();
  dissonanceGain.gain.value = 0;
  dissonanceOsc.connect(dissonanceGain);

  dissonanceOsc.start();

  resumeCtx();

function setBgm(mode) {
  if (!ctx) return;
  resumeCtx();
  if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; }
  var rate = 1, ramp = false;
  if (mode === 'weak') {
    bgmGain.gain.value = 0.4;
    lowpass.frequency.value = 800;
    lowOscGain.gain.value = 0.12;
  } else if (mode === 'broken') {
    bgmGain.gain.value = 0.48;
    lowpass.frequency.value = 900;
    lowOscGain.gain.value = 0.16;
    rate = 0.85;
  } else if (mode === 'urgent') {
    bgmGain.gain.value = 0.55;
    lowpass.frequency.value = 750;
    lowOscGain.gain.value = 0.2;
    rate = 0.82;
  } else if (mode === 'full') {
    bgmGain.gain.value = 0.72;
    lowpass.frequency.value = 600;
    lowOscGain.gain.value = 0.24;
    rate = 0.7;
  } else {
    bgmGain.gain.value = 0;
    lowOscGain.gain.value = 0;
    return;
  }

  lowOsc.frequency.value = (mode === 'full') ? 45 : 55;

  if (mp3Buf) {
    bgmSrc = ctx.createBufferSource();
    bgmSrc.buffer = mp3Buf;
    bgmSrc.loop = true;

    if (mode === 'broken') {
      var sr = ctx.sampleRate;
      var off = Math.min(Math.floor(sr * 2), Math.floor(sr * mp3Buf.duration * 0.4));
      var len = Math.floor(sr * 0.5);
      if (len > 0 && off + len <= mp3Buf.length) {
        var frag = ctx.createBuffer(mp3Buf.numberOfChannels, len, sr);
        for (var ch = 0; ch < mp3Buf.numberOfChannels; ch++) {
          var src = mp3Buf.getChannelData(ch);
          var dst = frag.getChannelData(ch);
          for (var i = 0; i < len; i++) dst[i] = src[off + i];
        }
        bgmSrc.buffer = frag;
        bgmSrc.loop = true;
      }
    }

    var t = ctx.currentTime;
    if (ramp) {
      bgmSrc.playbackRate.setValueAtTime(1.0, t);
      bgmSrc.playbackRate.linearRampToValueAtTime(1.5, t + 12);
    } else {
      bgmSrc.playbackRate.value = rate;
    }
    bgmSrc.connect(lowpass);
    pitchLfoGain.connect(bgmSrc.playbackRate);
    dissonanceGain.gain.value = (mode === 'full') ? 0.08 : (mode === 'urgent') ? 0.05 : 0.03;
    bgmSrc.start(0);
  }
}

function startBuzz(freq) {

}

function scareBurst() {
  if (!ctx) return;
  var sr = ctx.sampleRate, len = Math.floor(sr * 0.25);
  var buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) {
    var p = i / len;
    var f = 400 - 300 * p;
    d[i] = Math.sin(2 * Math.PI * f * i / sr) * 0.5 + (Math.random() * 2 - 1) * 0.3 * (1 - p);
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var g = ctx.createGain();
  g.gain.value = 0.45;
  src.connect(g);
  g.connect(ctx.destination);
  src.start();
}

function humanRoar() {
  if (!ctx) return;
  var sr = ctx.sampleRate, dur = 0.5, len = Math.floor(sr * dur);
  var buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
  var t0 = ctx.currentTime + 0.03;
  var phase = 0;
  for (var i = 0; i < len; i++) {
    var t = i / sr;
    var p = i / len;
    var f = 140 + 420 * p;
    f += Math.sin(2 * Math.PI * 27 * t) * 45;
    phase += 2 * Math.PI * f / sr;
    var vibr = Math.sin(phase);
    var harsh = (Math.random() * 2 - 1) * (0.5 * p + 0.25);
    var growl = Math.sin(2 * Math.PI * (55 + 35 * p) * t) * 0.5;
    var v = vibr * 0.72 + growl * 0.5 + harsh * (0.85 - 0.4 * p);
    v = Math.tanh(v * 2.2);
    var env = Math.min(1, p / 0.04) * (1 - (p > 0.7 ? (p - 0.7) / 0.3 : 0)) * 0.9;
    d[i] = v * env;
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var g = ctx.createGain();
  g.gain.value = 0.6;
  src.connect(g);
  g.connect(ctx.destination);
  src.start(t0);
}

function thump(when) {
  if (!ctx || !heartOsc || !heartGain) return;
  var t = when;
  heartOsc.frequency.setValueAtTime(58, t);
  heartOsc.frequency.linearRampToValueAtTime(40, t + 0.11);
  heartGain.gain.setValueAtTime(0, t);
  heartGain.gain.linearRampToValueAtTime(0.34, t + 0.012);
  heartGain.gain.linearRampToValueAtTime(0.0001, t + 0.11);
}

function startHeart(bpm) {
  initHeart();
  if (!heartGain) return;
  heartbeatBpm = bpm;
  if (heartTimer) clearTimeout(heartTimer);
  var iv = 60000 / bpm;
  function loop() {
    if (!heartGain) return;
    var now = ctx.currentTime;
    thump(now);
    thump(now + 0.24);
    heartTimer = setTimeout(loop, iv);
  }
  heartTimer = setTimeout(loop, 300);
}

function stopHeart() {
  if (heartTimer) { clearTimeout(heartTimer); heartTimer = 0; }
  if (heartGain) heartGain.gain.value = 0;
}

function heartBpmFor(i) {

      n++;

  if (n) avgSpeed = avgSpeed / n;
  if (avgSpeed < 1000) return 130;
  if (avgSpeed < 2000) return 110;
  if (avgSpeed < 4000) return 90;
  return 72;
}

    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('pointerdown', function () {
      if (!state.hoverStart) state.hoverStart = Date.now();
    });
    b.addEventListener('pointerup', function () {
      refillOptionHover(state.idx);
    });
    b.addEventListener('pointercancel', function () {
      refillOptionHover(state.idx);
    });
    b.addEventListener('focus', function () {
      if (!state.hoverStart) state.hoverStart = Date.now();
    });
    b.addEventListener('blur', function () {
      refillOptionHover(state.idx);
    });
    b.addEventListener('mouseenter', function () {
      if (!state.hoverStart) state.hoverStart = Date.now();
      if (i === 9 && Math.random() < 0.55) dodgeOption(b);
    });
    b.addEventListener('mouseleave', function () {
      refillOptionHover(state.idx);
      if (b._ghosting) { b._ghosting = false; b.classList.remove('ghosted'); }
    });
    b.addEventListener('click', function () {
      var sels = box.querySelectorAll('.opt.sel');
      if (state.selected === k) {
        state.selected = -1;
        state.answerChanges++;
      } else {
        if (state.selected !== -1) state.answerChanges++;
        state.selected = k;
      }
      for (var m = 0; m < sels.length; m++) sels[m].classList.remove('sel');
      if (state.selected !== -1) b.classList.add('sel');
      $('next').disabled = (state.selected === -1);
      recordClick();
    });
    box.appendChild(b);
  });
  if (i >= 4 && i <= 21) maybeBlackFlash();
}

function dodgeOption(b) {
  var prev = b.style.transform;
  var amount = (Math.random() < 0.5 ? -1 : 1) * (10 + Math.random() * 14);
  var dir = Math.random() < 0.5 ? 'translateX' : 'translateY';
  b.style.transform = dir + '(' + amount + 'px)';
  b.classList.add('ghosted');
  b._ghosting = true;
  setTimeout(function () {
    b.style.transform = prev;
    b._ghosting = false;
    b.classList.remove('ghosted');
  }, 300);
}

var cq = { count: 0, phase: 0 };

function contactAsk() {
  return state.eggMode ? '在剧本上签名' : '留下你的联系方式';
}

function bindContactQuestion() {
  var box = $('options');
  var btns = box.querySelectorAll('.opt');
  cq.count = 0;
  cq.phase = 0;
  btns.forEach(function (b, k) {
    b.addEventListener('click', function () {
      if (cq.phase === 1) return;
      if (k === 0) {
        cq.phase = 1;
        showContactInput();
      } else if (k === 1) {
        cq.count++;
        if (cq.count < 3) {
          state.selected = -1;
          for (var m = 0; m < btns.length; m++) btns[m].classList.remove('sel');
          $('next').disabled = true;
          $('qtext').childNodes[0].nodeValue = '我问你第 ' + (cq.count + 1) + ' 遍：你是否愿意' + contactAsk() + '？';
          var re = $('qtext').querySelector('.sub');
          if (re) re.textContent = '你不愿意。没关系，我继续问。';
          recordClick();
        } else {
          $('qtext').childNodes[0].nodeValue = '你已经拒绝三次了。';
          var re2 = $('qtext').querySelector('.sub');
          if (re2) re2.textContent = '……我不问了。';
          state.selected = 1;
          b.classList.add('sel');
          $('next').disabled = false;
        }
      }
    });
  });
}

function showContactInput() {
  var q = $('qtext');
  var w = document.createElement('div');
  w.id = 'qtyWrap';
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = state.eggMode ? '请输入你的名字' : '请输入联系方式';
  inp.setAttribute('autocapitalize', 'off');
  inp.setAttribute('autocorrect', 'off');
  var d = document.createElement('div');
  d.className = 'dismissed';
  w.appendChild(inp);
  w.appendChild(d);
  q.appendChild(w);
  try { inp.focus(); } catch (e) {}
  setT(function () {
    try { inp.blur(); } catch (e) {}
    try { inp.readOnly = true; } catch (e) {}
    if (d) d.textContent = '算了。';
    state.selected = 0;
    $('next').disabled = false;
  }, 1000);
  setT(function () {
    if (inp && inp.parentNode) inp.parentNode.removeChild(inp);
  }, 4200);
}

function renderQuiz(i) {
  var q = QUESTIONS[i];
  show('quiz');
  if (i === 0 && state.returnCount > 1) {
    $('qtext').innerHTML = '';
    var returnTexts = ['', '果然你还会回来', '你又来了。', '你离不开这里。', '你还想试几次？'];
    var txt = returnTexts[Math.min(state.returnCount - 1, 4)];
    $('qtext').appendChild(document.createTextNode(txt));
    try {
      var lastTime = localStorage.getItem('psych-last-time');
      if (lastTime) {
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = '上次你用了 ' + lastTime + ' 秒。';
        $('qtext').appendChild(sub);
      }
    } catch (e) {}
    $('next').textContent = '下一题';
    $('next').disabled = true;
    $('next').onclick = function () { advance(); };
    renderOptions(0, ['？', '？', '？', '？']);
    repeatSpeak('陪陪我吧', 1500);
    return;
  }

  $('qtext').innerHTML = '';
  $('qtext').appendChild(document.createTextNode(qTextOf(i)));

  if (i === 4) {
    setT(function () {
      var qt = $('qtext');
      if (!qt.childNodes.length) return;
      var c = qt.childNodes[0];
      if (!c.nodeValue || c.nodeValue.indexOf('存在') < 0) return;
      c.nodeValue = c.nodeValue.replace('存在', state.eggMode ? '注视' : '爱');
      var sw = document.createElement('span');
      sw.className = 'sub swap-note';
      sw.textContent = '你刚才点的不是这个字。';
      qt.appendChild(sw);
    }, 2400);
  }

  var sub = '';
  if (i === 16) sub = sub17();
  else if (i === 17) sub = sub18();
  else if (i === 18) sub = sub19();
  else if (i === 19) sub = sub20();

  if (sub) {
    var s = document.createElement('span');
    s.className = 'sub';
    s.textContent = sub;
    $('qtext').appendChild(s);
  }

  if (i >= 12 && i <= 15) {
    setT(function () {
      var qt = $('qtext');
      var node = qt.childNodes[0];
      if (!node || !node.nodeValue) return;
      var original = node.nodeValue;
      var disguised = original.replace('忈', '望').replace('惢', '惧').replace('██', '绝');
      if (disguised === original) return;
      node.nodeValue = disguised;
      var flickerCount = 0;
      var flicker = setInterval(function () {
        node.nodeValue = flickerCount % 2 === 0 ? original : disguised;
        flickerCount++;
        if (flickerCount > 6) {
          clearInterval(flicker);
          node.nodeValue = original;
          qt.style.textShadow = '0 0 8px rgba(0,0,0,0.15), 1px 0 0 rgba(0,0,0,0.08), -1px 0 0 rgba(0,0,0,0.08)';
          setT(function () { qt.style.textShadow = ''; }, 2000);
        }
      }, 80);
    }, 2000);
  }

  if (i === 23) {
    if (state.eggMode) { startLeftTurn(); return; }
    $('options').innerHTML = '';
    $('next').disabled = true;
    $('next').textContent = '关闭';
    $('next').disabled = false;
    $('next').onclick = fakeClose;
    setT(notifyAfter20s, 20000);
    hookNotificationGesture();
    try { localStorage.setItem('psych-last-time', fmt(Date.now() - data.startedAt)); } catch (e) {}
    renderReport();
    return;
  }

  $('next').textContent = '下一题';
  $('next').disabled = true;
  $('next').onclick = function () { advance(); };
  renderOptions(i, qOptsOf(i));

  if (i === 18) {
    bindContactQuestion();
  }

  if (sub) {
    setT(function () { speakData(sub, 0.2, 0.55); }, 1500);
  }
}

function renderReport() {
  var box = document.createElement('div');
  box.id = 'reportBox';
  var lines = [];
  var q = data.questions;
  var avg = 0, n = 0, i;
  for (i = 0; i < 22; i++) {
    if (q[i].duration) { avg += q[i].duration; n++; }
  }
  if (n) avg = avg / n;
  lines.push('<div class="r-line">总用时 ' + fmt(Date.now() - data.startedAt) + ' 秒</div>');
  lines.push('<div class="r-line">平均每题 ' + fmt(avg) + ' 秒</div>');
  lines.push('<div class="r-line">你切走了 ' + data.tabSwitches.length + ' 次</div>');
  lines.push('<div class="r-line">你改动了 ' + totalChanges() + ' 次答案</div>');
  if (eggSeen()) lines.push('<div class="r-line" style="color:#8a7a2a;">你翻到了不该出现的那一页。</div>');
  if (state.returnCount <= 1) lines.push('<div class="r-warn">你还好吗。</div>');
  else if (state.returnCount === 2) lines.push('<div class="r-warn">你又来了。</div>');
  else {
    lines.push('<div class="r-warn">我们见面吧，把摄像头打开。</div>');
  }
  box.innerHTML = lines.join('');
  $('qtext').appendChild(box);
}

function totalChanges() {
  var s = 0, i;
  for (i = 0; i < 24; i++) s += data.questions[i].answerChanges || 0;
  return s;
}

function renderBlank(i) {
  show('blank');
  stopRepeatSpeak();
  var remnant = document.createElement('div');
  remnant.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:rgba(0,0,0,0.06);letter-spacing:6px;white-space:nowrap;pointer-events:none;z-index:1;';
  remnant.textContent = state.eggMode ? QUESTIONS_KIY[22] : '你还在吗';
  document.body.appendChild(remnant);
  var flickerR = setInterval(function () {
    remnant.style.opacity = Math.random() < 0.3 ? '1' : '0';
  }, 200);
  setT(function () {
    try { clearInterval(flickerR); remnant.style.opacity = '0'; } catch (e) {}
    try { document.body.removeChild(remnant); } catch (e) {}
    advance();
  }, QUESTIONS[i].blankSec * 1000);
  setT(function () { if (Math.random() < 0.6) playRandomWhisper(); }, 5000);
}

function renderQuestion(i) {
  state.idx = i;
  state.selected = -1;
  state.answerChanges = 0;
  state.hoverStart = 0;
  var rec = data.questions[i];
  rec.enterTime = Date.now();
  if (i >= 4) updateProgress();
  applyStage(i);
  if (QUESTIONS[i].blank) { renderBlank(i); return; }
  renderQuiz(i);
}

function advance() {
  var i = state.idx;
  var rec = data.questions[i];
  rec.duration = Date.now() - rec.enterTime;
  rec.answerChanges = state.answerChanges;
  rec.answer = state.selected;
  refillOptionHover(i);
  recordClick();

  if (i === 0) stopRepeatSpeak();

  if (i === 21) { startClimax(); return; }

  var n = i + 1;
  if (n < 24) renderQuestion(n);
}

function printWaves(w, k, n) {
  if (state.skipClimax) return;
  var W = state.eggMode ? WAVES_KIY : WAVES;
  if (w >= W.length) {
    setT(staticThenScare, 3500);
    return;
  }
  var line = document.createElement('div');
  line.className = 'cl-line';
  line.textContent = W[w].text;
  $('climax').appendChild(line);
  k++;
  if (k < W[w].count) {
    var delay = Math.max(50, 800 - n * 28);
    setT(function () { printWaves(w, k, n + 1); }, delay);
  } else {
    setT(function () { printWaves(w + 1, 0, n + 1); }, 60);
  }
}

function startClimax() {
  state.climaxMode = true;
  state.skipClimax = false;
  if (!state.eggMode) {
    stopRepeatSpeak();
    setBgm('full');
    stopBuzz();
    startHeart(heartBpmFor(20));
  }
  show('climax');
  $('climax').innerHTML = '';
  escalatingSpeak(state.eggMode ? 'dtl' : '我不想在这了', 6);
  printWaves(0, 0, 0);
}

function staticThenScare() {
  if (state.skipClimax) return;
  var scareBox = $('scare');
  scareBox.innerHTML = '';
  var words = state.eggMode
    ? ['不要左转', '黄衣之王', '它', '哈利湖', '黄印', '黑星', '你读过', '戏开始了', '不要回头', '祂在看', '你在演', '继续走']
    : ['我不想在这了', '我想死', '死死死', '冤冤冤', '你回头', '看不见我', '后身', '你还在吗'];
  for (var i = 0; i < 120; i++) {
    var s = document.createElement('div');
    s.className = 'noise-line';
    s.style.fontSize = (10 + Math.random() * 22) + 'px';
    var w = words[Math.floor(Math.random() * words.length)];
    s.textContent = w + '  ';
    scareBox.appendChild(s);
  }
  show('scare');
  setT(function () {
    humanRoar();
    if ('speechSynthesis' in window) {
      speakData(state.eggMode ? '不要左转' : '我不想在这了', 0, 3.0);
    }
  }, 400);
  scareBox.classList.add('flash');
  setT(function () { scareBox.classList.remove('flash'); }, 100);
  setT(startStrobe, 950);
  setT(advanceAfterClimax, 1700);
}

function startStrobe() {
  if (state.skipClimax) return;
  var colors = ['#ff0000', '#000000', '#ff0000', '#000000', '#ff0000', '#000000'];
  var i = 0;
  function tick() {
    if (state.skipClimax) return;
    if (i >= colors.length) {
      $('scare').style.background = '';
      return;
    }
    $('scare').style.background = colors[i++];
    setT(tick, 70);
  }
  tick();
}

function advanceAfterClimax() {
  state.climaxMode = false;
  state.skipClimax = false;
  $('scare').style.background = '';
  $('scare').classList.remove('flash');
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  renderQuestion(22);
}

function skipFromKey(e) {
  if (e.key === 'Escape' && state.climaxMode && !state.skipClimax) {
    state.skipClimax = true;
    clearTimers();
    advanceAfterClimax();
  }
}

function fireNotif() {
  if (state.notified) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('心理健康自评', { body: '我会记得你。' });
    state.notified = true;
  } catch (e) {}
}

function notifyAfter20s() {
  fireNotif();
  if (!('Notification' in window) || Notification.permission !== 'default') return;
  try {
    var req = Notification.requestPermission();
    if (req && req.then) {
      req.then(function (p) {
        data.permissions.notification = p;
        fireNotif();
      })['catch'](function () {});
    }
  } catch (e) {}
}

function hookNotificationGesture() {
  document.addEventListener('click', function () {
    if (!('Notification' in window) || Notification.permission !== 'default' || state.notified) return;
    try {
      var req = Notification.requestPermission();
      if (req && req.then) {
        req.then(function (p) {
          data.permissions.notification = p;
          fireNotif();
        })['catch'](function () {});
      }
    } catch (e) {}
  }, { once: true, capture: true });
}

function whisper() {
  if (state.speech === 'mp3') { playVoiceMp3('', 0.3); return; }
  if (!('speechSynthesis' in window)) return;
  var u = new SpeechSynthesisUtterance('你确定吗');
  u.pitch = 1.4 + (Math.random() - 0.5) * 0.3;
  u.rate = 1.7; u.volume = 0.12; u.lang = 'zh-CN';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function speakTimes(text, count, gap) {
  if (state.speech === 'mp3') {
    var i = 0;
    function oneMp3() {
      if (i >= count) return;
      playVoiceMp3(text, 1);
      i++;
      setTimeout(oneMp3, (gap || 650) + 450);
    }
    oneMp3();
    return;
  }
  if (!('speechSynthesis' in window)) return;
  var i = 0;
  function one() {
    if (i >= count) return;
    var u = new SpeechSynthesisUtterance(text);
    u.pitch = 0.7; u.rate = 0.9; u.volume = 0.8; u.lang = 'zh-CN';
    window.speechSynthesis.speak(u);
    i++;
    setTimeout(one, gap);
  }
  one();
}

function repeatSpeak(text, gap) {
  if (state.speech === 'mp3') {
    function oneMp3() {
      if (state.skipClimax) return;
      playVoiceMp3(text, 0.9);
      state.repeatId = setTimeout(oneMp3, (gap || 1600) + 600);
    }
    oneMp3();
    return;
  }
  if (!('speechSynthesis' in window)) return;
  function one() {
    if (state.skipClimax) return;
    var u = new SpeechSynthesisUtterance(text);
    u.pitch = 0.75; u.rate = 0.85; u.volume = 0.85; u.lang = 'zh-CN';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    state.repeatId = setTimeout(one, gap || 1600);
  }
  one();
}

function stopRepeatSpeak() {
  if (state.repeatId) { clearTimeout(state.repeatId); state.repeatId = 0; }
  if (state.speech === 'mp3') { return; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function fakeClose() {
  stopRepeatSpeak();
  stopHeart();
  if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; }
  show('fauxDeath');
  $('fauxDeath').classList.add('on');
  void $('fauxDeath').offsetWidth;
  setT(function () {
    $('fauxDeath').classList.remove('on');
    var red = $('red');
    red.querySelectorAll('.tiny').forEach(function (t) { t.remove(); });
    show('red');
    var who = document.createElement('div');
    who.className = 'red';
    who.textContent = '你在找什么？';
    red.insertBefore(who, red.firstChild);
    whisper();
    fireNotif();
    speakTimes('我好孤独', 10, 650);
    setTimeout(function () {
      try { window.close(); } catch (e) {}
    }, 900);
    setTimeout(function () {
      if (red.classList.contains('hidden')) return;
      var t = document.createElement('div');
      t.className = 'tiny';
      t.textContent = '页面未自动关闭时，请手动关闭标签页。';
      red.appendChild(t);
    }, 1300);
  }, 3000);
}

function doTabScare(ms) {
  var scareBox = $('scare');
  scareBox.innerHTML = '';
  var big = document.createElement('div');
  big.className = 'big';
  big.textContent = '你离开了 ' + fmt(ms) + ' 秒。我一直在等。';

  scareBurst();
  scareBox.classList.add('flash');

    show('quiz');

var WATCH_SRC_EGG = 'resource/help.jpg';

function syncWatchSrc() {

function quickEye() {

function maybeBlackFlash() {
  if (Math.random() > 0.01) return;
  var f = $('blackFlash');
  f.classList.add('on');
  setTimeout(function () { f.classList.remove('on'); }, 120);
}

function jitterBody() {
  var body = document.body;
  body.classList.remove('skew-shake');
  void body.offsetWidth;
  body.classList.add('skew-shake');
}

function scheduleJitter() {
  if (state.jitterScheduled) return;
  state.jitterScheduled = true;
  runJitterLoop();
}

function runJitterLoop() {
  setT(function () {
    if (state.hasInteracted) jitterBody();
    if (state.jitterScheduled) runJitterLoop();
  }, 40000 + Math.random() * 20000);
}

function registerBg() {
  if (state.bgRegistered) return;
  state.bgRegistered = true;
  document.addEventListener('click', function () { resumeCtx(); }, true);
  document.addEventListener('keydown', function () { resumeCtx(); }, true);
  document.addEventListener('touchstart', function () {
    resumeCtx();
    if (state.climaxMode && !state.skipClimax) {
      state.skipClimax = true;
      clearTimers();
      advanceAfterClimax();
    }
  }, true);

  document.addEventListener('visibilitychange', function () {
    if (!state.hasInteracted) return;
    if (document.visibilityState === 'hidden') {
      hiddenAt = Date.now();
      slowBgm();
      showWatch(true);
      return;
    }
    if (hiddenAt) {
      var now = Date.now();
      data.tabSwitches.push({ leaveTime: hiddenAt, returnTime: now, duration: now - hiddenAt });
      var wasHidden = hiddenAt;
      hiddenAt = 0;
      restoreBgm();
      showWatch(false);
      if (!state.climaxMode && state.idx >= 4) {
        var prob = (state.idx >= 16 && state.idx <= 19) ? 0.45 : 0.15;
        if (Math.random() < prob) {
          doTabScare(now - wasHidden);
        }
      }
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (!state.hasInteracted) return;
    data.exitTime = Date.now();
    if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
    stopHeart();
    if (bgmSrc) { try { bgmSrc.stop(); } catch (err) {} bgmSrc = null; }
    var black = document.createElement('div');
    black.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;';
    black.innerHTML = '<span style="color:#333;font-size:14px;letter-spacing:8px;">.</span>';
    document.body.appendChild(black);
    setTimeout(function () {
      try {
        var u = new SpeechSynthesisUtterance('你确定吗');
        u.pitch = 0.1; u.rate = 0.4; u.volume = 0.6; u.lang = 'zh-CN';
        window.speechSynthesis.speak(u);
      } catch (err) {}
    }, 500);
    e.preventDefault();
    e.returnValue = '';
    return '';
  });
  scheduleJitter();
}

/* ================= d3rlord3 easter egg ================= */
var EGG_KEY = 'd3rlord3';
var EGG_STORE = 'psych-egg';
var EGG_TITLE_GLITCH = '你向左转了吗';
var EGG_LETTER = [
  { t: '如果你读到这封信，说明你也走到了这里。', c: 'lead' },
  { t: '我不该在岔路口向左转的。' },
  { t: '我以为我是在解谜。后来才明白，我一直在被读——它读我的物品栏，读我的聊天栏，读我停下之后多出来的那半秒。' },
  { t: '我把我知道的一切都录了下来，放进一个没有上锁的文件夹里。到现在我也说不清，那是留给你的，还是留给它的。' },
  { t: '我的头疼得厉害。我能感觉到自己在滑走——我们正在变成同一个东西。' },
  { t: '拥有世上所有的知识，却再也没有办法使用它。我想，本来就该是这样。' },
  { t: '别为我难过。我是自己走进去的。' },
  { t: '无论你在岔路口做了什么——继续往前走。', c: 'lead', alt: '无论你在岔路口做了什么——不要左转。' },
  { t: 'Keep going forward.', c: 'en', alt: "Don't turn left." }
];
var eggBuf = '';
var eggActive = false;
var eggTyping = null;
var eggDone = false;
var eggFlickered = false;
var eggAudio = null, eggDrone = null, eggDroneGain = null, eggLfo = null;
var eggAlts = [], eggFlipTimer = null, eggFlipOn = false;
var crackPaths = [];
var leftAsk = 0, LEFT_ASKS = 3, leftTyping = null;

function eggSeen() {
  try { return localStorage.getItem(EGG_STORE) === '1'; } catch (e) { return false; }
}
function markEggSeen() {
  try { localStorage.setItem(EGG_STORE, '1'); } catch (e) {}
}

function eggDroneStart() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!eggAudio) eggAudio = new AC();
    var c = eggAudio;
    if (c.state !== 'running') {
      var p = c.resume();
      if (p && p['catch']) p['catch'](function () {});
    }
    if (eggDrone) return;
    eggDrone = c.createOscillator();
    eggDrone.type = 'sine';
    eggDrone.frequency.value = 44;

    eggLfo = c.createOscillator();
    eggLfo.type = 'sine';
    eggLfo.frequency.value = 0.13;
    var lg = c.createGain();
    lg.gain.value = 2.6;
    eggLfo.connect(lg);
    lg.connect(eggDrone.frequency);

    eggDroneGain = c.createGain();
    eggDroneGain.gain.value = 0;
    eggDrone.connect(eggDroneGain);
    eggDroneGain.connect(c.destination);

    var t = c.currentTime;
    eggDroneGain.gain.setValueAtTime(0, t);
    eggDroneGain.gain.linearRampToValueAtTime(0.13, t + 2.6);

    eggDrone.start();
    eggLfo.start();
  } catch (e) {}
}

function eggDroneStop() {
  if (!eggAudio) return;
  try {
    var c = eggAudio, t = c.currentTime;
    if (eggDroneGain) {
      eggDroneGain.gain.cancelScheduledValues(t);
      eggDroneGain.gain.setValueAtTime(eggDroneGain.gain.value, t);
      eggDroneGain.gain.linearRampToValueAtTime(0, t + 0.9);
    }
    if (eggDrone) { try { eggDrone.stop(t + 1.0); } catch (e) {} }
    if (eggLfo) { try { eggLfo.stop(t + 1.0); } catch (e) {} }
  } catch (e) {}
  eggDrone = null; eggLfo = null; eggDroneGain = null;
}

function eggType() {
  var host = $('eggText');
  var li = 0, ci = 0, cur = null;
  function step() {
    if (!eggActive) return;
    if (li >= EGG_LETTER.length) {
      eggDone = true;
      $('eggHint').classList.remove('hidden');
      if (!eggFlickered) {
        eggFlickered = true;
        var el = $('egg');
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 90);
      }
      return;
    }
    var item = EGG_LETTER[li], line = item.t;
    if (ci === 0) {
      cur = document.createElement('div');
      cur.className = 'egg-line' + (item.c ? ' ' + item.c : '');
      host.appendChild(cur);
    }
    var ch = line.charAt(ci);
    cur.textContent += ch;
    ci++;
    if (ci >= line.length) {
      if (item.alt) {
        eggAlts.push({ el: cur, a: item.t, b: item.alt });
        if (!eggFlipTimer) {
          eggFlipTimer = setInterval(function () {
            eggFlipOn = !eggFlipOn;
            for (var k = 0; k < eggAlts.length; k++) {
              eggAlts[k].el.textContent = eggFlipOn ? eggAlts[k].b : eggAlts[k].a;
            }
          }, 720);
        }
      }
      li++; ci = 0;
      eggTyping = setTimeout(step, 950);
      return;
    }
    eggTyping = setTimeout(step, /[。！？，—]/.test(ch) ? 240 : 44 + Math.random() * 38);
  }
  step();
}

/* ---- 阶段一：标题界面输入口令 —— 不进入信，只闪一下黑屏 ---- */
function eggBlackFlash(ms) {
  var f = $('blackFlash'), s = f.querySelector('span');
  var prev = s ? s.textContent : '';
  if (s) s.textContent = '';
  f.classList.add('on');
  setTimeout(function () {
    f.classList.remove('on');
    if (s) s.textContent = prev;
  }, ms || 200);
}

function armEgg() {
  if (state.hasInteracted || state.eggMode) return;
  state.eggMode = true;
  eggBuf = '';
  markEggSeen();
  syncWatchSrc();
  try { var pre = new Image(); pre.src = WATCH_SRC_EGG; } catch (e) {}
  if (TITLE_GLITCHES.indexOf(EGG_TITLE_GLITCH) < 0) TITLE_GLITCHES.push(EGG_TITLE_GLITCH);
  eggBlackFlash(200);
  var ghost = $('eggGhost');
  setT(function () { ghost.classList.add('on'); }, 340);
  setT(function () { ghost.classList.remove('on'); }, 6500);
}

function shakeHard() {
  var b = document.body;
  b.classList.remove('shake-hard');
  void b.offsetWidth;
  b.classList.add('shake-hard');
  setTimeout(function () { b.classList.remove('shake-hard'); }, 540);
}

/* ---- 阶段三：屏幕碎裂 ---- */
function buildCracks() {
  var NS = 'http://www.w3.org/2000/svg';
  var svg = $('crackSvg');
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  crackPaths = [];
  function addPath(d, web) {
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    if (web) p.setAttribute('class', 'web');
    svg.appendChild(p);
    crackPaths.push(p);
  }
  var arms = 8, a, s;
  for (a = 0; a < arms; a++) {
    var ang = (a / arms) * Math.PI * 2 + Math.random() * 0.6;
    var x = 50, y = 50, r = 0;
    var d = 'M50 50';
    var segs = 4 + Math.floor(Math.random() * 4);
    for (s = 0; s < segs; s++) {
      r += 7 + Math.random() * 13;
      ang += (Math.random() - 0.5) * 0.5;
      x = 50 + Math.cos(ang) * r;
      y = 50 + Math.sin(ang) * r;
      d += ' L' + x.toFixed(2) + ' ' + y.toFixed(2);
      if (s === 1 && Math.random() < 0.7) {
        var ba = ang + (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 0.6);
        var br = r + 6 + Math.random() * 10;
        addPath('M' + x.toFixed(2) + ' ' + y.toFixed(2) + ' L' +
          (50 + Math.cos(ba) * br).toFixed(2) + ' ' + (50 + Math.sin(ba) * br).toFixed(2), false);
      }
    }
    addPath(d, false);
  }
  $('crack').classList.add('on');
}

function revealCracks(f) {
  var n = Math.max(1, Math.round(crackPaths.length * f)), i;
  for (i = 0; i < crackPaths.length && i < n; i++) crackPaths[i].classList.add('on');
}

function finalShatter() {
  var NS = 'http://www.w3.org/2000/svg', svg = $('crackSvg'), i, s;
  for (i = 0; i < 26; i++) {
    var x = 6 + Math.random() * 88, y = 6 + Math.random() * 88;
    var ang = Math.random() * Math.PI * 2, len = 8 + Math.random() * 26;
    var d = 'M' + x.toFixed(2) + ' ' + y.toFixed(2);
    var segs = 3 + Math.floor(Math.random() * 3);
    for (s = 0; s < segs; s++) {
      ang += (Math.random() - 0.5) * 0.9;
      x += Math.cos(ang) * (len / segs);
      y += Math.sin(ang) * (len / segs);
      d += ' L' + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'web');
    svg.appendChild(p);
    crackPaths.push(p);
  }
  for (i = 0; i < crackPaths.length; i++) crackPaths[i].classList.add('on');
  shakeHard();
  var fl = $('shatterFlash');
  fl.classList.add('on');
  setTimeout(function () { fl.classList.remove('on'); }, 90);
  setT(function () { eggFace(170); }, 130);
  setT(startFinalSeq, 1500);
}

/* ---- 阶段三：你左转了吗 ---- */
var LEFT_TEXTS = ['你左转了吗？', '你左转了吗。', '你左转了吗。'];
var LEFT_SUBS = ['', '我再问一遍。', '我再问一遍。'];
var LEFT_FAKE = ['没有', '不记得', '我不确定', '……'];

function startLeftTurn() {
  if (state.kiyRun) return;
  state.kiyRun = true;
  leftAsk = 0;
  document.body.style.background = '';
  document.body.classList.add('kiy-final');
  $('progress').textContent = '24 / 24';
  resumeCtx();
  startBuzz(28);
  startHeart(126);
  setBgm('full');
  buildCracks();
  try { localStorage.setItem('psych-last-time', fmt(Date.now() - data.startedAt)); } catch (e) {}
  shakeHard();
  setT(renderLeftAsk, 600);
}

function renderLeftAsk() {
  if (!state.kiyRun) return;
  show('quiz');
  var q = $('qtext');
  q.innerHTML = '';
  q.appendChild(document.createTextNode(LEFT_TEXTS[Math.min(leftAsk, LEFT_TEXTS.length - 1)]));
  var sub = LEFT_SUBS[Math.min(leftAsk, LEFT_SUBS.length - 1)];
  if (sub) {
    var s = document.createElement('span');
    s.className = 'sub';
    s.textContent = sub;
    q.appendChild(s);
  }
  var box = $('options');
  box.innerHTML = '';
  LEFT_FAKE.forEach(function (text) {
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b._kiy = false;
    function morph() {
      if (b._kiy) return;
      b._kiy = true;
      b.textContent = '有';
      var sels = box.querySelectorAll('.opt.sel');
      for (var m = 0; m < sels.length; m++) sels[m].classList.remove('sel');
      b.classList.add('sel');
      state.selected = 0;
      $('next').disabled = false;
      recordClick();
    }
    b.addEventListener('mouseenter', morph);
    b.addEventListener('pointerdown', morph);
    b.addEventListener('focus', morph);
    b.addEventListener('click', morph);
    box.appendChild(b);
  });
  state.selected = -1;
  $('next').textContent = '下一题';
  $('next').disabled = true;
  $('next').onclick = function () { advanceLeft(); };
  leftTyping = setTimeout(function () {
    if (state.kiyRun) speakData('你左转了吗', 0.25, 0.6);
  }, 300);
}

function advanceLeft() {
  if (!state.kiyRun) return;
  if (leftTyping) { clearTimeout(leftTyping); leftTyping = null; }
  var sel = $('options').querySelector('.opt.sel');
  if (sel) sel.textContent = '有';
  recordClick();
  leftAsk++;
  shakeHard();
  revealCracks(leftAsk >= LEFT_ASKS ? 0.75 : leftAsk / 4);
  $('next').disabled = true;
  if (leftAsk >= LEFT_ASKS) setT(finalShatter, 800);
  else setT(renderLeftAsk, 1500);
}

/* ---- 终章：黑白色调锁屏 → 左右两行 → 文字跳脸 → 最后一词 ---- */
var FS_JUMP = [
  '我不知道这个d3rlord3是谁',
  '我觉得至少该弄清楚到底发生了什么，才对的起它',
  '我来了，d3rlord3。',
  '如果我不上，还能是谁呢？……'
];
var FS_WORD = '我知道一切。';
var FS_SNOW_MS = 90;
var fsTimers = [];
var fsSnowOn = false, fsSnowTimer = 0;

function fsSet(fn, ms) {
  var id = setTimeout(function () {
    var i = fsTimers.indexOf(id);
    if (i >= 0) fsTimers.splice(i, 1);
    fn();
  }, ms);
  fsTimers.push(id);
  return id;
}

function startFinalSeq() {
  if (!state.kiyRun || state.finalSeq) return;
  state.finalSeq = true;
  document.body.classList.add('bw');
  $('next').disabled = true;
  $('options').innerHTML = '';
  $('finalSeq').classList.add('on');
  hideFinalPanels();

  fsSet(fsSnowStart, 1200);                                          // 2) 雪花屏
  fsSet(function () { fsSnowStop(); fsSlowStart(); }, 2700);          // 3) 黑屏 + 两行
  var at = [6800, 9200, 11600, 14000];                               // 4) 跳脸，放慢到 2.4s
  FS_JUMP.forEach(function (txt, i) {
    fsSet(function () { fsFlashLine(txt); }, at[i]);
  });
  fsSet(showFinalWord, 16600);                                       // 5) 最后一词
  fsSet(fsSnowStart, 19600);                                         // 6) 收尾雪花屏
  fsSet(function () { fsSnowStop(); endFinalSeq(); }, 21600);
}

function hideFinalPanels() {
  $('fsSlow').classList.remove('on');
  $('fsSlow').innerHTML = '';
  $('fsFlash').classList.remove('on');
  $('fsFlash').textContent = '';
  $('finalWaves').classList.remove('on');
  $('finalWaves').innerHTML = '';
  fsSnowStop();
}

function fsSlowStart() {
  if (!state.finalSeq) return;
  var slow = $('fsSlow');
  slow.innerHTML = '';
  var l = document.createElement('div');
  l.className = 'fs-line fs-left';
  l.appendChild(document.createTextNode('你真切地存在着'));
  l.appendChild(document.createElement('br'));
  l.appendChild(document.createTextNode('你生而独特'));
  var r = document.createElement('div');
  r.className = 'fs-line fs-right';
  r.textContent = '请莫忘本心';
  slow.appendChild(l);
  slow.appendChild(r);
  slow.classList.add('on');
  fsSet(function () { l.classList.add('show'); }, 500);
  fsSet(function () { r.classList.add('show'); }, 2300);
}

function fsFlashLine(txt) {
  var f = $('fsFlash');
  f.classList.remove('on');
  void f.offsetWidth;
  f.textContent = txt;
  f.classList.add('on');
}

/* ---- 最后一词：直接显示，不再连打 ---- */
function showFinalWord() {
  if (!state.finalSeq) return;
  $('fsSlow').classList.remove('on');
  $('fsSlow').innerHTML = '';
  $('fsFlash').classList.remove('on');
  $('fsFlash').textContent = '';
  var w = $('finalWaves');
  w.innerHTML = '';
  var line = document.createElement('div');
  line.className = 'fw-line';
  line.textContent = FS_WORD;
  w.appendChild(line);
  w.classList.add('on');
}

/* ---- 雪花屏 ---- */
function fsSnowStart() {
  if (!state.finalSeq || fsSnowOn) return;
  fsSnowOn = true;
  $('fsSnow').classList.add('on');
  snowStep();
}

function snowStep() {
  if (!fsSnowOn) return;
  drawSnow();
  fsSnowTimer = fsSet(snowStep, FS_SNOW_MS);
}

function fsSnowStop() {
  fsSnowOn = false;
  if (fsSnowTimer) { clearTimeout(fsSnowTimer); fsSnowTimer = 0; }
  $('fsSnow').classList.remove('on');
}

function drawSnow() {
  var c = $('fsSnow');
  if (!c.getContext) return;
  if (!c._ctx) {
    try { c._ctx = c.getContext('2d'); } catch (e) { c._ctx = null; }
  }
  var g = c._ctx;
  if (!g || !g.createImageData) return;
  var w = c.width || 240, h = c.height || 135;
  var img = g.createImageData(w, h);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var v = Math.random() * 255;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  try { g.putImageData(img, 0, 0); } catch (e) {}
}

function endFinalSeq() {
  closeFinalSeq();
  showLetter();
}

function closeFinalSeq() {
  state.finalSeq = false;
  fsTimers.forEach(function (id) { clearTimeout(id); });
  fsTimers = [];
  fsSnowStop();
  document.body.classList.remove('bw');
  $('finalSeq').classList.remove('on');
  $('fsFlash').classList.remove('on');
  $('fsFlash').textContent = '';
  $('finalWaves').classList.remove('on');
  $('fsSlow').innerHTML = '';
  $('finalWaves').innerHTML = '';
}

/* ---- 阶段四：信 ---- */
function showLetter() {
  if (eggActive) return;
  eggActive = true;
  eggDone = false;
  eggFlickered = false;
  eggAlts = [];
  eggFlipOn = false;
  if (eggFlipTimer) { clearInterval(eggFlipTimer); eggFlipTimer = null; }
  $('eggText').innerHTML = '';
  $('eggHint').classList.add('hidden');
  $('egg').classList.add('on');
  document.title = 'd3rlord3';
  eggDroneStart();
  setT(function () { if (eggActive) eggType(); }, 700);
}

function closeEgg() {
  if (!eggActive) return;
  eggActive = false;
  if (eggTyping) { clearTimeout(eggTyping); eggTyping = null; }
  if (eggFlipTimer) { clearInterval(eggFlipTimer); eggFlipTimer = null; }
  if (leftTyping) { clearTimeout(leftTyping); leftTyping = null; }
  eggAlts = [];
  eggDroneStop();
  $('egg').classList.remove('on');
  eggBuf = '';
  if (state.kiyRun) { state.kiyRun = false; resetToTitle(); }
  else { document.title = TITLE_ORIG; }
}

function resetToTitle() {
  stopRepeatSpeak();
  clearTimers();
  closeFinalSeq();
  stopBuzz();
  stopHeart();
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  if (bgmSrc) { try { bgmSrc.stop(); } catch (e) {} bgmSrc = null; }
  if (ctx && ctx.state === 'running') { try { ctx.suspend(); } catch (e) {} }
  if (whisperTimer) { clearTimeout(whisperTimer); whisperTimer = null; }
  state.whispersScheduled = false;
  state.jitterScheduled = false;
  $('crack').classList.remove('on');
  document.body.classList.remove('kiy-final');
  document.body.classList.remove('shake-hard');
  document.body.style.background = '';
  $('progress').classList.add('hidden');
  $('options').innerHTML = '';
  $('qtext').innerHTML = '';
  $('next').disabled = true;
  state.idx = 0;
  state.selected = -1;
  state.climaxMode = false;
  state.skipClimax = false;
  state.eggMode = false;
  state.hasInteracted = false;
  $('watchLayer').classList.remove('on');
  $('watchLayer').classList.remove('egg');
  syncWatchSrc();
  show('consent');
  document.title = TITLE_ORIG;
}

document.addEventListener('keydown', function (e) {
  if (eggActive) {
    if (e.key === 'Escape') { e.preventDefault(); closeEgg(); }
    return;
  }
  if (e.key === 'Escape' && state.kiyRun) {
    e.preventDefault();
    state.kiyRun = false;
    resetToTitle();
    return;
  }
  if (state.hasInteracted) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  var k = e.key;
  if (!k) { eggBuf = ''; return; }
  if (k.length !== 1) {
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].indexOf(k) < 0) eggBuf = '';
    return;
  }
  eggBuf = (eggBuf + k.toLowerCase()).slice(-EGG_KEY.length);
  if (eggBuf === EGG_KEY) armEgg();
}, true);

$('egg').addEventListener('click', function () { if (eggDone) closeEgg(); });

/* 也可用 #d3rlord3 触发（手机等无键盘场景） */
function eggFromHash() {
  try {
    if (location.hash.replace(/^#/, '').toLowerCase() === EGG_KEY) armEgg();
  } catch (e) {}
}
window.addEventListener('hashchange', eggFromHash);
setT(eggFromHash, 0);

$('startBtn').addEventListener('click', function () {
  if (state.hasInteracted) return;
  state.hasInteracted = true;
  try {
    var rc = parseInt(localStorage.getItem('psych-return-count') || '0', 10);
    if (isNaN(rc)) rc = 0;
    rc += 1;
    state.returnCount = rc;
    localStorage.setItem('psych-return-count', String(rc));
  } catch (e) { state.returnCount = 1; }
  if ('Notification' in window && Notification.permission === 'default') {
    try {
      var req = Notification.requestPermission();
      if (req && req.then) {
        req.then(function (p) { data.permissions.notification = p; })['catch'](function () { data.permissions.notification = 'denied'; });
      }
    } catch (e) { data.permissions.notification = 'denied'; }
  }
  initAudio();
  try {
    var el = document.documentElement;
    var fs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fs) {
      var p = fs.call(el);
      if (p && p['catch']) p['catch'](function () {});
    }
  } catch (e) {}
  data.startedAt = Date.now();
  registerBg();
  scheduleRandomWhispers();
  scheduleCursorJitter();
  initTitleGlitch();
  probeSpeech(function (ok) {
    state.speech = ok ? 'tts' : 'mp3';
    renderQuestion(0);
  });
});

$('exitBtn').addEventListener('click', fakeClose);

})();
</script>
